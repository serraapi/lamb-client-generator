<style>
  :root {
    --bg: #181816;
    --card-bg: #21211e;
    --input-bg: #2b2b27;
    --border: #3b3a35;
    --border-focus: #7a786f;
    --text-primary: #ececec;
    --text-secondary: #9e9c94;
    --accent: #d97757;
    --accent-hover: #e58869;
    --btn-secondary: #32322d;
    --btn-secondary-hover: #3d3d37;
    --pre-bg: #121210;
    --pre-text: #a8c49e;
    --radius: 12px;
    --radius-sm: 8px;
    --success: #a8c49e;
    --error: #e58869;
    /* Color del mode aleatori (complementari del taronja) */
    --random: #4a9ea3;
    --random-glow: rgba(74, 158, 163, 0.35);
  }

  html { color-scheme: dark; }
  html:has(body.light-theme) { color-scheme: light; }
  body.light-theme {
    color-scheme: light;
    --bg: #f6f5f0;
    --card-bg: #ffffff;
    --input-bg: #eeece4;
    --border: #dcd9cd;
    --border-focus: #8e8b80;
    --text-primary: #191816;
    --text-secondary: #6e6b62;
    --accent: #d97757;
    --accent-hover: #c46344;
    --btn-secondary: #e6e3d8;
    --btn-secondary-hover: #dcd8cb;
    --pre-bg: #eeece4;
    --pre-text: #2f6832;
    --random: #2f8a90;
    --random-glow: rgba(47, 138, 144, 0.3);
  }

  * { box-sizing: border-box; }

  html { overflow-x: clip; }
  body {
    overflow-x: clip;
    margin: 0;
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap { width: 100%; max-width: 1240px; }

  /* v0.6: espai de treball en dues columnes (editor per pestanyes + fitxa fixa) */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .editor { min-width: 0; }
  .tabs {
    display: flex; gap: 2px; padding: 4px 12px 0;
    box-shadow: inset 0 -1px 0 var(--border);
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 10px 16px; font: inherit; font-size: 0.9rem; font-weight: 500;
    color: var(--text-secondary); cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
  .card.panels { padding: 0; }
  .panels-body { padding: 22px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .sub-title { font-size: 0.95rem; font-weight: 600; margin: 0; }
  /* Pestanya Reunió: cada bloc amb el títol a l'esquerra i el seu interruptor a la dreta */
  .bloc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .bloc-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
  .bloc-ctrl { margin: 0; }
  /* v0.6.1: totes les pestanyes es fan amb el mateix bloc (títol a l'esquerra, control a la dreta) */
  .panel > .bloc + .bloc, #meetingBox > .bloc { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .bloc-head-start { justify-content: flex-start; gap: 8px; }
  .bloc-head .btn-sm { padding: 5px 12px; }
  .bloc-head label.bloc-title, .bloc-head h3.bloc-title { margin: 0; }
  .bloc .counter { font-weight: 400; }
  .bloc textarea::placeholder, .bloc input::placeholder { color: var(--text-secondary); opacity: 0.75; }
  .esborrany {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px; padding: 12px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); border-left: 3px solid var(--accent); background-color: var(--card-bg);
  }
  .esborrany[hidden] { display: none; }
  .esborrany p { margin: 0; font-size: 0.88rem; line-height: 1.4; }
  .esborrany-accions { display: flex; gap: 8px; }
  .esborrany .btn { padding: 6px 14px; font-size: 0.85rem; width: auto; margin: 0; }
  .fitxa-fila .v.falta { color: var(--error); font-weight: 400; font-style: italic; }
  .tab-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-left: 12px; }
  .tab-arrow {
    width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    background: none; color: var(--text-primary); cursor: pointer;
  }
  .tab-arrow:hover:not(:disabled) { border-color: var(--border-focus); }
  .tab-arrow:disabled { opacity: 0.35; cursor: default; }
  .tab-arrow:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
  @keyframes sacseig {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); } 30% { transform: translateX(5px); }
    45% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 75% { transform: translateX(-1px); }
  }
  @keyframes resplendor { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 4px var(--random-glow); } }
  .switch-row.sacseig { animation: sacseig 0.6s ease; }
  .switch-row.sacseig .track { animation: resplendor 1.2s ease; border-radius: 999px; }
  @media (prefers-reduced-motion: reduce) { .switch-row.sacseig { animation: none; } }
  @media (max-width: 600px) { .tab-nav { display: none; } }
  #evalCode { max-width: 260px; }
  #evalCode:disabled { opacity: 0.6; cursor: not-allowed; }
  /* v0.6.3: botons que demanen un segon clic per confirmar */
  :root { --perill: #f2555a; --perill-fons: rgba(242, 85, 90, 0.14); }
  body.light-theme { --perill: #c62f35; --perill-fons: rgba(198, 47, 53, 0.1); }
  .btn.confirmant, .btn.confirmant:hover { background-color: var(--perill-fons); border-color: var(--perill); color: var(--perill); }
  @keyframes confirma { 0% { transform: scale(0.96); } 100% { transform: none; } }
  .btn.confirmant { animation: confirma 0.18s ease; }
  /* v0.6.3: pestanya Avaluació */
  .clau-box {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding: 10px 12px; font-size: 0.84rem;
    background-color: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .clau-box .clau-k { color: var(--text-secondary); }
  .clau-box code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
  .field-note.avis { color: var(--error); }
  .bloc .lang-checkbox-group { margin: 0; }
  .bloc .meeting-nums { margin-top: 0; }
  .toolbar-modes { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  #tab-comportament #dynamicPanel .dynamic-banner { margin: 0 0 16px; }
  #tab-projecte #infoOberta { min-height: 120px; }
  #tab-projecte #infoOculta { min-height: 240px; }
  .panel .dyn-identity { border-bottom: none; padding-bottom: 0; }
  .panel .card-title-row { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }

  /* v0.6.3: la fitxa no té barra de desplaçament; si és més alta que la finestra, s'enganxa per baix (vegeu ajustarFitxa) */
  .fitxa { position: sticky; top: 16px; }
  .fitxa-card { margin-bottom: 0; }
  .fitxa-card { padding: 18px 18px 16px; }
  .fitxa-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 6px; }
  .fitxa-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .fitxa-cap .fitxa-title { margin: 0; }
  .fitxa-cap .btn-sm { padding: 4px 10px; font-size: 0.74rem; }
  .fitxa-grup { padding: 10px 0 8px; border-top: 1px solid var(--border); }
  .fitxa-grup:first-child { border-top: none; padding-top: 4px; }
  .fitxa-grup h3 { font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); margin: 0 0 4px; }
  .fitxa-fila {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    width: calc(100% + 12px); margin: 0 -6px; padding: 4px 6px; border: none; border-radius: 6px;
    background: none; color: var(--text-primary); font: inherit; font-size: 0.84rem; text-align: left; cursor: pointer;
  }
  .fitxa-fila:hover { background-color: var(--pre-bg); }
  .fitxa-fila:focus-visible { outline: 2px solid var(--border-focus); }
  .fitxa-fila .k { color: var(--text-secondary); flex: none; }
  .fitxa-fila .v { text-align: right; font-weight: 500; overflow-wrap: anywhere; }
  .fitxa-fila .v.random { color: var(--random); }
  .fitxa-fila .v.buit { color: var(--text-secondary); font-weight: 400; font-style: italic; }
  .fitxa-export { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border); }
  .fitxa-export label.field { margin: 0 0 -4px; }
  .trait-row.destacat { animation: destacat 1.2s ease; }
  @keyframes destacat { 0%, 40% { background-color: var(--random-glow); } 100% { background-color: transparent; } }

  .modal.modal-wide { max-width: 1000px; width: 100%; }
  #visorOverlay .prompt-viewer-box { margin: 0; }
  #visorOverlay #ui_lbl_viewer_title { visibility: hidden; }

  /* v0.6.4: visor en mode de lectura */
  .visor-modes { width: 270px; padding: 2px; }
  .visor-modes .seg-btn { padding: 4px 8px; font-size: 0.76rem; }
  .prompt-viewer-text[hidden], .lectura[hidden] { display: none; }
  .lectura { display: grid; grid-template-columns: 230px minmax(0, 1fr); height: min(68vh, 760px); }
  .lectura-index { overflow-y: auto; padding: 10px 8px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; }
  .lectura-entrada {
    text-align: left; padding: 7px 10px; border: none; border-radius: 6px; background: none;
    color: var(--text-secondary); font: inherit; font-size: 0.8rem; line-height: 1.3; cursor: pointer;
  }
  .lectura-entrada:hover, .lectura-entrada:focus-visible { color: var(--text-primary); background-color: var(--input-bg); outline: none; }
  .lectura-entrada.actiu { color: var(--text-primary); background-color: var(--input-bg); box-shadow: inset 2px 0 0 var(--accent); }
  .lectura-sub { padding: 4px 10px 4px 22px; font-size: 0.75rem; }
  .lectura-text { position: relative; }
  .lectura-pagina { display: flex; flex-direction: column; min-height: 0; }
  .lectura-text { flex: 1; overflow-y: auto; padding: 22px 34px 28px; line-height: 1.6; color: var(--text-primary); }
  .lectura-text > :first-child { margin-top: 0; }
  .lectura-text h2 { font-size: 1.2em; font-weight: 600; margin: 0 0 0.8em; }
  .lectura-text h3 { font-size: 1.05em; font-weight: 600; margin: 1.6em 0 0.5em; padding-top: 0.9em; border-top: 1px solid var(--border); }
  .lectura-text h4, .lectura-text h5 { font-size: 0.95em; font-weight: 600; margin: 1.3em 0 0.4em; color: var(--text-primary); }
  .lectura-text p { margin: 0.6em 0; }
  .lectura-text ul, .lectura-text ol { margin: 0.5em 0; padding-left: 1.4em; }
  .lectura-text li { margin: 0.25em 0; }
  .lectura-text li::marker { color: var(--text-secondary); }
  .lectura-text strong { font-weight: 600; }
  .lectura-text em { color: var(--text-secondary); }
  .lectura-text code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em; padding: 1px 5px; border-radius: 4px; background-color: var(--input-bg); }
  .md-taula { overflow-x: auto; margin: 0.8em 0; border: 1px solid var(--border); border-radius: 6px; }
  .md-taula table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
  .md-taula th, .md-taula td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  .md-taula th { background-color: var(--input-bg); font-weight: 600; white-space: nowrap; }
  .md-taula tr:last-child td { border-bottom: none; }
  .md-ocult { display: flex; flex-direction: column; gap: 4px; margin: 0.8em 0; padding: 8px 12px; border: 1px dashed var(--border-focus); border-radius: 6px; }
  .md-ocult span { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
  .md-ocult code { background: none; padding: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .lectura-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .lectura-nav .btn:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 720px) {
    .lectura { grid-template-columns: 1fr; height: min(72vh, 760px); }
    .lectura-index { display: none; }
    .lectura-text { padding: 16px 16px 20px; }
  }
  #visorOverlay #previewJson { margin: 0; }
  .visor-json { display: block; margin: 0; border: none; border-radius: 0; max-height: min(68vh, 760px); height: min(68vh, 760px); overflow: auto; padding: 16px 20px; }
  .visor-json[hidden] { display: none; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .fitxa { position: static; }
    .panels-body { padding: 18px 16px; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 6px 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin: 0; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 56px; height: 56px; flex: none; }

  .badge {
    background-color: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-left: 6px;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .theme-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 0;
    cursor: pointer;
    width: 31px;
    height: 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-btn svg { width: 16px; height: 16px; display: block; }
  .theme-btn .icon-moon { display: none; }
  body.light-theme .theme-btn .icon-sun { display: none; }
  body.light-theme .theme-btn .icon-moon { display: block; }
  .theme-btn:hover { background-color: var(--btn-secondary); border-color: var(--border-focus); }

  .lang-selector {
    display: flex;
    gap: 4px;
    background-color: var(--card-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .lang-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .lang-btn.active { background-color: var(--btn-secondary); color: var(--text-primary); }
  .lang-btn:hover:not(.active) { color: var(--text-primary); }


  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
  }

  label.field {
    display: block;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }
  label.field:first-of-type { margin-top: 0; }

  .meeting-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .meeting-nums { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
  .meeting-nums label.field { display: flex; flex-direction: column; gap: 6px; margin: 0; }
  .meeting-nums input { width: 90px; }
  .meeting-nums.disabled { opacity: 0.45; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus { outline: none; border-color: var(--border-focus); }

  .tooltip-container { position: relative; display: inline-flex; align-items: center; }

  /* Indicador taronja que llisca fins a l'opció triada */

  body.modal-open { overflow: hidden; }

  /* --- Visor de prompt --- */

  /* v0.6.4: transició del mode dinàmic. La columna «Aleatori» passa d'amplada 0 a una columna més, l'indicador
     llisca fins a la nova posició i la fila s'eixampla, tot alhora. Els botons se separen amb una vora transparent
     (en lloc del gap) perquè una columna d'amplada 0 no deixi espai. */
  .trait-row { transition: grid-template-columns 0.36s cubic-bezier(0.22, 1, 0.36, 1); }
  .trait-row .seg-grid {
    gap: 0; padding: 1.5px;
    grid-template-columns: minmax(0, var(--c0, 0fr)) repeat(var(--nl), minmax(0, 1fr));
    transition: grid-template-columns 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .dyn-traits .trait-row .seg-grid { --c0: 1fr; }
  .trait-row .seg-btn { min-width: 0; border: 1.5px solid transparent; background-clip: padding-box; }
  .trait-row .seg-random {
    opacity: 0; padding-left: 0; padding-right: 0; border-width: 0; pointer-events: none;
    transition: opacity 0.22s ease, padding 0.36s ease, border-width 0.36s ease;

  .dyn-traits .trait-row .seg-random { opacity: 1; padding-left: 4px; padding-right: 4px; border-width: 1.5px; pointer-events: auto; transition-delay: 0.1s, 0s, 0s; }
  .trait-row .seg-indicator {
    left: 3px;
    width: calc((100% - 3px) / var(--N) - 3px);
    transform: translateX(calc(var(--i, 0) * (100% + 3px)));
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), width 0.36s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, box-shadow 0.25s ease;
  }
  @media (prefers-reduced-motion: reduce) {

  }
  .traits-manage { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
  .traits-manage[hidden] { display: none; }
  .add-btn {

    transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
  }
  .add-btn svg { width: 14px; height: 14px; flex: none; }
  .add-btn:hover:not(:disabled), .add-btn:focus-visible { color: var(--text-primary); border-color: var(--accent); background-color: rgba(217, 119, 87, 0.06); outline: none; }
  .add-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .paperera { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 0.8rem; }
  .paperera[hidden] { display: none; }
  .paperera-titol { color: var(--text-secondary); margin-right: 2px; }
  .xip { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background-color: var(--input-bg); }
  .xip button { background: none; border: none; font: inherit; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; }
  .xip-recuperar { gap: 6px; padding: 4px 10px 4px 5px; font-size: 0.8rem; }
  .xip-recuperar svg, .xip-esborrar svg { width: 13px; height: 13px; flex: none; }
  .xip-etiqueta { font-size: 0.68rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; background-color: var(--btn-secondary); color: var(--text-secondary); }
  .xip-nom { color: var(--text-primary); text-decoration: line-through; text-decoration-color: var(--text-secondary); }
  .xip-recuperar:hover:not(:disabled) .xip-nom, .xip-recuperar:focus-visible .xip-nom { text-decoration: none; }
  .xip-recuperar:hover:not(:disabled), .xip-recuperar:focus-visible { color: var(--accent); outline: none; }
  .xip-recuperar:disabled { cursor: not-allowed; opacity: 0.5; }
  .xip-esborrar { padding: 0 8px; border-left: 1px solid var(--border) !important; }
  .xip-esborrar:hover, .xip-esborrar:focus-visible { color: var(--perill) !important; outline: none; }
  .xip-esborrar.confirmant { color: var(--perill) !important; background-color: var(--perill-fons) !important; font-size: 0.76rem; padding: 0 10px; }

  /* Editor dels trets: peu amb estat i nivells dels trets propis */
  .ed-foot-l, .ed-foot-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ed-foot-l { flex: 1 1 auto; }
  .ed-foot-r { flex: none; }
  .ed-foot-l .btn[hidden], .ed-foot-r .btn[hidden] { display: none; }
  .ed-estat { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.35; }
  .ed-section input[type="text"] { font-size: 0.86rem; }
  .ed-nom-tret { font-size: 1rem !important; font-weight: 500; }
  .ed-nivell { margin-top: 14px; padding: 12px 14px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background-color: var(--bg); }
  .ed-nivell textarea { min-height: 48px; font-size: 0.82rem; }
  .ed-nivell input[type="text"] { padding: 8px 10px; font-size: 0.82rem; }
  .ed-nivell-cap { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .ed-nivell-num {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background-color: var(--accent); color: #fff; font-size: 0.78rem; font-weight: 600;
  }
  .ed-nivell-cap .ed-nivell-nom { flex: 1; font-weight: 600; font-size: 0.9rem !important; }
  #edBody > .add-btn { margin-top: 14px; }

  /* Rúbrica: barra de pesos (cada segment és un criteri, amplada = pes) */
  .rb-barra { display: flex; gap: 2px; height: 26px; padding: 2px; border-radius: 7px; background-color: var(--input-bg); border: 1px solid var(--border); }
  .rb-barra.sobre { border-color: var(--perill); box-shadow: 0 0 0 1px var(--perill-fons); }
  .rb-seg {
    min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    border-radius: 5px; background-color: var(--btn-secondary); color: var(--text-secondary);
    font-size: 0.72rem; font-weight: 600; transition: background-color 0.2s ease, color 0.2s ease, flex-grow 0.3s ease;
  }
  .rb-seg.sel, .rb-seg.hl { background-color: var(--accent); color: #fff; }
  .rb-seg.error { box-shadow: inset 0 -2px 0 var(--perill); }
  .rb-seg.rb-buit { background: none; border: 1px dashed var(--border-focus); }
  @media (prefers-reduced-motion: reduce) { .rb-seg { transition: none; } }

  .rb-lletra {
    flex: none; width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    background-color: var(--input-bg); border: 1px solid var(--border); font-size: 0.76rem; font-weight: 600; color: var(--text-primary);
  }
  .rb-lletra.gran { width: 38px; height: 38px; border-radius: 9px; font-size: 1.05rem; }
  .rb-pes { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 0.82rem; }

  /* Rúbrica a la pestanya: llista compacta; cada fila obre l'editor en aquell criteri */
  .rb-taula { margin-top: 10px; display: flex; flex-direction: column; }
  .rb-fila {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
    width: 100%; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);
    background: none; border: none; border-radius: 6px; color: var(--text-primary); font: inherit; font-size: 0.86rem; text-align: left; cursor: pointer;
  }
  .rb-fila:hover, .rb-fila:focus-visible { background-color: var(--pre-bg); outline: none; }
  .rb-fila .rb-nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-fila.error .rb-lletra, .rb-item.error .rb-lletra { border-color: var(--perill); color: var(--perill); }
  #rubricaNota[hidden] { display: none; }

  /* Editor de la rúbrica: llista de criteris a l'esquerra, criteri triat a la dreta */
  .modal.modal-rubrica { max-width: 1080px; height: min(880px, 100%); }
  .rb-cos { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
  .rb-side { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 18px 24px; border-right: 1px solid var(--border); overflow-y: auto; }
  .rb-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.82rem; }
  .rb-total-k { color: var(--text-secondary); }
  .rb-total-v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .rb-total.ok .rb-total-v { color: var(--success); }
  .rb-total.error .rb-total-v { color: var(--perill); }
  .rb-items { display: flex; flex-direction: column; gap: 2px; }
  .rb-item {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 7px 8px; border: 1px solid transparent; border-radius: var(--radius-sm);
    background: none; color: var(--text-primary); font: inherit; font-size: 0.84rem; text-align: left; cursor: pointer;
  }
  .rb-item .rb-nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rb-item:hover { background-color: var(--input-bg); }
  .rb-item:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
  .rb-item.sel { background-color: var(--input-bg); border-color: var(--border); }
  .rb-item.sel .rb-lletra { background-color: var(--accent); border-color: var(--accent); color: #fff; }
  .rb-side .paperera { padding-top: 10px; border-top: 1px solid var(--border); }

  .rb-detall { padding: 18px 24px 24px; overflow-y: auto; font-size: 0.86rem; }
  .rb-det-cap { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .rb-det-titol { flex: 1; min-width: 0; }
  .rb-det-titol h3 { margin: 0; font-size: 1.05rem; font-weight: 500; overflow-wrap: break-word; }
  .rb-det-sub { font-size: 0.76rem; color: var(--text-secondary); }
  .rb-det-cap .btn svg { width: 14px; height: 14px; }
  .rb-det-cap .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .rb-faltes { margin: 8px 0 0; font-size: 0.8rem; color: var(--error); line-height: 1.4; }
  .rb-faltes:empty { display: none; }
  .rb-fila2 { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 14px; }
  .rb-camp { position: relative; }
  .rb-camp .ed-label { margin-top: 12px; }
  .rb-camp textarea { min-height: 52px; font-size: 0.84rem; }
  .rb-camp-pes input { padding-right: 30px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
  .rb-camp-pes input::-webkit-outer-spin-button, .rb-camp-pes input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rb-sufix { position: absolute; right: 12px; bottom: 10px; color: var(--text-secondary); font-size: 0.86rem; pointer-events: none; }
  .rb-seccio { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .rb-seccio-cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .rb-seccio > .field-note { margin: 4px 0 0; }
  .rb-nivell { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .rb-nivell-etq { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .rb-nivell-num { font-size: 1.35rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  .rb-nivell-nom { font-size: 0.74rem; color: var(--text-secondary); }
  .rb-nivell-camps { display: flex; flex-direction: column; gap: 6px; }
  .rb-nivell-camps textarea { min-height: 52px; font-size: 0.82rem; }
  .rb-nivell-camps input { padding: 7px 10px; font-size: 0.8rem; }

  /* Mode de selecció: caselles, agafador, barra d'accions i arrossegament */
  #traitsContainer, .rb-items { position: relative; }
  .sel-controls { display: none; align-items: center; gap: 4px; flex: none; }
  .ordenable .sel-controls, .rb-items .sel-controls { display: inline-flex; }
  .sel-casella { display: none; }
  .seleccio .sel-casella { display: inline-block; }
  .ordenable .trait-row { cursor: grab; }
  .ordenable .trait-desc { padding-left: 24px; }
  .seleccio .trait-desc { padding-left: 47px; }
  .ordenable .trait-row .seg-btn, .ordenable .trait-row .gear-btn { cursor: pointer; }
  .seleccio .trait-accions { display: none; }
  .agafador {
    width: 20px; height: 26px; padding: 0; border: none; border-radius: 4px; background: none;
    color: var(--text-secondary); cursor: grab; display: inline-flex; align-items: center; justify-content: center; touch-action: none;
  }
  .agafador svg { width: 14px; height: 14px; }
  .agafador:hover, .agafador:focus-visible { color: var(--text-primary); background-color: var(--btn-secondary); outline: none; }
  .sel-casella { width: 15px; height: 15px; margin: 0 4px 0 0; accent-color: var(--accent); cursor: pointer; }
  .seleccio .trait-row { cursor: pointer; user-select: none; margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: var(--radius-sm); }
  .seleccio .trait-row .seg-grid { pointer-events: none; opacity: 0.5; }
  .trait-row.seleccionat, .rb-item.seleccionat { background-color: rgba(217, 119, 87, 0.09); }
  .arrossegant {
    position: relative; z-index: 5; background-color: var(--card-bg) !important; cursor: grabbing;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--border); transition: none !important;
  }
  .en-grup { opacity: 0.35; }
  body.arrossegant-cos, body.arrossegant-cos * { cursor: grabbing !important; user-select: none; }
  .linia-insercio { position: absolute; left: 0; right: 0; height: 2px; border-radius: 2px; background-color: var(--accent); pointer-events: none; z-index: 6; }
  .sel-barra {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background-color: var(--input-bg); font-size: 0.82rem;
  }
  .sel-barra[hidden] { display: none; }
  .sel-tots { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .sel-tots input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .sel-compte { flex: 1; color: var(--text-secondary); min-width: 0; }
  .sel-eliminar svg { width: 14px; height: 14px; }
  .sel-eliminar:not(:disabled):hover { color: var(--perill); border-color: var(--perill); }
  .sel-eliminar:disabled { opacity: 0.45; cursor: not-allowed; }
  #rbSelBtn.btn-primary { padding: 5px 12px; font-size: 0.78rem; }
  /* «Seleccionar» dels eixos: petit, al costat del títol, sense fer créixer la capçalera (els interruptors no es mouen) */
  .bloc-titol-grup { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .bloc-head:has(.bloc-titol-grup) { min-height: 24px; }
  .btn.btn-mini, .bloc-head .btn.btn-mini { padding: 2px 9px; font-size: 0.72rem; line-height: 1.5; border-radius: 6px; }
  .rb-side-botons .btn { padding: 5px 10px; }
  .rb-side-cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rb-side-botons { display: inline-flex; gap: 6px; }
  .rb-side-botons .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .rb-buit-msg { color: var(--text-secondary); margin: 8px 0; }
  .rb-side-titol { font-size: 0.82rem; color: var(--text-secondary); }
  .rb-side .sel-barra { margin-bottom: 0; gap: 8px; }
  .rb-items .rb-item { grid-template-columns: auto auto minmax(0, 1fr) auto; user-select: none; }
  .rb-items.seleccio .rb-item { cursor: pointer; }
  .rb-items .rb-item .agafador { margin-left: -4px; }
  #rbAfegir[hidden] { display: none; }

  /* Fases de l'avaluació: caselles en ordre, amb una fletxa entre fase i fase */
  .fases-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
  .fase-mobil { touch-action: pan-y; }
  .linia-insercio.vertical { top: 0; bottom: 0; left: auto; right: auto; width: 2px; height: auto; }
  .fases-sep { color: var(--text-secondary); font-size: 0.9rem; }
  .fases-group .lang-checkbox-label { padding: 8px 14px; font-size: 0.82rem; }
  .fases-group .lang-checkbox-label.bloquejat { cursor: not-allowed; }
  .fases-group .lang-checkbox-label.bloquejat input { cursor: not-allowed; }
  .fases-group .lang-checkbox-label.apagat { color: var(--text-secondary); }
  #fasesNota[hidden] { display: none; }

  .fitxa-avis { display: flex; flex-direction: column; gap: 6px; }
  .fitxa-avis[hidden] { display: none; }
  .fitxa-avis p { margin: 0; }
  .fitxa-fila .v.falta-fort { color: var(--error); }

  @media (max-width: 720px) {
    .rb-cos { grid-template-columns: minmax(0, 1fr); overflow-y: auto; overflow-x: hidden; }
    .rb-side, .rb-detall { min-width: 0; }
    .rb-side { border-right: none; border-bottom: 1px solid var(--border); padding: 14px 16px; overflow: visible; }
    .rb-items:not(.seleccio) { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
    .rb-items:not(.seleccio) .rb-item { grid-template-columns: auto auto; flex: none; }
    .rb-items:not(.seleccio) .rb-item .sel-controls { display: none; }
    .rb-items:not(.seleccio) .rb-item .rb-nom { display: none; }
    .rb-detall { padding: 14px 16px 20px; overflow: visible; }
    .rb-det-cap { flex-wrap: wrap; }
    .rb-det-titol { flex-basis: calc(100% - 50px); }
    .rb-det-cap .btn { margin-left: 50px; }
    .rb-fila2 { grid-template-columns: minmax(0, 1fr) 96px; }
    .rb-nivell { grid-template-columns: 1fr; gap: 4px; }
    .rb-nivell-etq { flex-direction: row; align-items: baseline; gap: 8px; }
    .ed-foot { flex-wrap: wrap; }
  }

  @media (max-width: 720px) {
    .logo { width: 44px; height: 44px; }
    .trait-row, .dyn-traits .trait-row { grid-template-columns: 1fr; grid-template-areas: "name" "seg" "desc"; }
    .guide-cols { grid-template-columns: 1fr; }
    .modal-head, .modal-body { padding-left: 16px; padding-right: 16px; }
    .seg-btn { white-space: normal; overflow: visible; line-height: 1.2; font-size: 0.74rem; padding: 6px 3px; hyphens: auto; }
    .btn-group-row { flex-direction: column; }
    .ed-foot { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="logo-taronja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8906f"/><stop offset="1" stop-color="#c8603f"/></linearGradient><linearGradient id="logo-blau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb4b9"/><stop offset="1" stop-color="#37858a"/></linearGradient><clipPath id="logo-sobreTaronja"><rect x="2" y="2" width="45" height="32" rx="11"/><path d="M9 31 L4 43 L21 33 Z"/></clipPath></defs><g fill="#000" opacity="0.14" transform="translate(0 2)"><rect x="2" y="2" width="45" height="32" rx="11"/><path d="M9 31 L4 43 L21 33 Z"/><rect x="17" y="25" width="45" height="29" rx="10"/><path d="M55 51 L60 63 L43 53 Z"/></g><rect x="2" y="2" width="45" height="32" rx="11" fill="url(#logo-taronja)"/><path d="M9 31 L4 43 L21 33 Z" fill="#cd6646"/><rect x="8.9" y="11.2" width="8.2" height="11.6" rx="4.1" fill="#fff"/><circle cx="24.5" cy="17" r="4.1" fill="#fff"/><rect x="31.9" y="11.2" width="8.2" height="11.6" rx="4.1" fill="#fff"/><g fill="none" stroke="#000" stroke-linejoin="round" clip-path="url(#logo-sobreTaronja)"><rect x="17" y="25" width="45" height="29" rx="10" stroke-width="5" opacity="0.08"/><rect x="17" y="25" width="45" height="29" rx="10" stroke-width="2.5" opacity="0.12"/></g><rect x="17" y="25" width="45" height="29" rx="10" fill="url(#logo-blau)"/><path d="M55 51 L60 63 L43 53 Z" fill="#3a898e"/><circle cx="28" cy="39.5" r="4.1" fill="#fff"/><rect x="35.4" y="33.7" width="8.2" height="11.6" rx="4.1" fill="#fff"/><circle cx="51" cy="39.5" r="4.1" fill="#fff"/></svg>
      <div>
        <h1 id="ui_title">Generador de Clients</h1>
        <p class="subtitle" id="ui_subtitle"></p>
      </div>
    </div>
    <div class="header-controls">
      <button class="theme-btn" id="themeToggle" onclick="alternarTema()" title="Mode fosc / clar" aria-label="Mode fosc / clar">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="lang-selector">
        <button class="lang-btn active" onclick="canviarIdiomaUI('cat')" id="btn_lang_cat">CAT</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('es')" id="btn_lang_es">ES</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('en')" id="btn_lang_en">EN</button>
      </div>
    </div>
  </header>


  <div class="esborrany" id="esborranyAvis" role="status" hidden>
    <p id="esborranyText"></p>
    <div class="esborrany-accions">
      <button type="button" class="btn btn-primary btn-sm" id="esborranyRecuperar" onclick="recuperarEsborrany()"></button>
      <button type="button" class="btn btn-secondary btn-sm" id="esborranyDescartar" onclick="descartarEsborrany()"></button>
    </div>
  </div>

  <div class="workspace">
    <main class="editor">
      <div class="card panels">
        <nav class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabbtn-projecte" data-tab="projecte" onclick="activarPestanya('projecte')"></button>
          <button class="tab" role="tab" id="tabbtn-client" data-tab="client" onclick="activarPestanya('client')"></button>
          <button class="tab" role="tab" id="tabbtn-comportament" data-tab="comportament" onclick="activarPestanya('comportament')"></button>
          <button class="tab" role="tab" id="tabbtn-reunio" data-tab="reunio" onclick="activarPestanya('reunio')"></button>
          <button class="tab" role="tab" id="tabbtn-avaluacio" data-tab="avaluacio" onclick="activarPestanya('avaluacio')"></button>
          <div class="tab-nav">
            <button type="button" class="tab-arrow" id="tabPrev" onclick="pestanyaVeina(-1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button type="button" class="tab-arrow" id="tabNext" onclick="pestanyaVeina(1)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
        </nav>
        <div class="panels-body">
      <section class="panel" id="tab-projecte" role="tabpanel" aria-labelledby="tabbtn-projecte">
        <div class="bloc">

<script>
let currentLang = "cat";
let promptFontSize = 0.82;
const estat = {
  sel: {}, dinSel: {}, arees: [], perso: {}, tancament: null,
  codiPropi: false, codiAval: "Code 42",
  propis: [], eliminats: [], ordre: [],   // v0.6.4 (mode avançat): trets propis, trets eliminats i ordre dels eixos
  rubrica: null,               // v0.6.4: rúbrica de l'avaluació (vegeu normalitzarRubrica)
  fases: { observacio: true, resum: true, punts: true, client: true },  // v0.6.4: fases del mode d'avaluació
  ordreFases: ["observacio", "resum", "punts", "client"]
};
const TANCAMENT_DEFECTE = Object.freeze({ actiu: true, avis: 10, extra: 4 });
const TANCAMENT_LIMITS = { avis: [2, 50], extra: [1, 10] };
estat.tancament = { ...TANCAMENT_DEFECTE };
const ALEATORI = "aleatori";
let eixEditor = null;
let firmaTrets = "";

/* ===== Utilitats ===== */
const $ = id => document.getElementById(id);
const t = () => UI_LANGS[currentLang];
const esDinamic = () => $("dynamicProfile").checked;
const esAvancat = () => $("advancedMode").checked;
const identitatAleatoria = () => $("randomIdentity").checked;   // v0.6.1: «Client dinàmic», independent de la personalitat
/* v0.6.4: tots els trets coneguts: els de base i els propis del docent (encara que estiguin trets) */
const totsElsTrets = () => [...ATRIBUTS, ...estat.propis];
const tret = id => totsElsTrets().find(a => a.id === id);
const opcio = (attrId, optId) => { const a = tret(attrId); return a ? a.opcions.find(o => o.id === optId) : undefined; };

/* Trets que té el client. Sense el mode avançat, sempre els de base;
   amb el mode avançat, també els propis i sense els que el docent ha tret. */
function tretsVisibles() {
  if (!esAvancat()) return ATRIBUTS.filter(a => a.actiu);
  return ordenarTrets(totsElsTrets().filter(a => a.actiu !== false && !estat.eliminats.includes(a.id)));
}
const tretsEliminats = () => esAvancat() ? totsElsTrets().filter(a => a.actiu !== false && estat.eliminats.includes(a.id)) : [];

/* ===== v0.6.4: trets propis del docent =====
   Tenen la mateixa forma que els de ATRIBUTS (nom i descripcions amb cat/es/en, tots tres iguals)
   perquè la interfície i el prompt els tractin igual. Eixos E7 i següents. */
const MAX_EIXOS = 10;                    // la llavor té columnes per a 10 eixos aleatoris com a màxim
const MIN_NIVELLS = 2, MAX_NIVELLS = 5;
const MAX_NOM_TRET = 40, MAX_NOM_NIVELL = 24;
const tots3 = v => ({ cat: v, es: v, en: v });

const nomTret = a => textNet(a.nom[currentLang] || a.nom.cat) || v06().tretSenseNom;
const nomNivell = (o, k) => textNet(o.nom[currentLang] || o.nom.cat) || v06().nivellN(k + 1);

function nouNivell(p) {
  let k = 1;
  while (p.opcions.some(o => o.id === "n" + k)) k++;
  return { id: "n" + k, nom: tots3(""), descripcio: tots3(""), etiqueta: "", prompt: "", marcadors: "", guia: "" };
}

function nouTretPropi() {
  let k = 1, e = 7;
  while (totsElsTrets().some(a => a.id === "propi" + k)) k++;
  while (totsElsTrets().some(a => a.eix === "E" + e)) e++;
  const p = { id: "propi" + k, eix: "E" + e, propi: true, actiu: true, nom: tots3(""), desc: "", defecte: "", opcions: [] };
  for (let i = 0; i < 3; i++) p.opcions.push(nouNivell(p));
  sincronitzarPropi(p);
  return p;
}

/* El primer nivell és el de per defecte; l'etiqueta del prompt és el nom del nivell */
function sincronitzarPropi(p) {
  p.defecte = p.opcions[0] ? p.opcions[0].id : "";
  p.opcions.forEach(o => { o.etiqueta = textNet(o.nom.cat); });
}

/* Capçalera de l'eix al prompt: «NOM: com ha d'influir en la conversa» */
function capcaleraPropi(a) {
  const n = textNet(a.nom.cat).toLocaleUpperCase("ca"), d = textNet(a.desc);
  return d ? `${n}: ${d}` : n;
}

/* Què li falta a un tret propi per poder anar al prompt */
function faltesPropi(p) {
  const x = v06(), f = [];
  const sensNom = [], sensConducta = [];
  p.opcions.forEach((o, k) => {
    if (!textNet(o.nom.cat)) sensNom.push(k + 1);
    if (!textNet(o.prompt)) sensConducta.push(k + 1);
  });
  if (!textNet(p.nom.cat)) f.push(x.fNomTret);
  if (sensNom.length) f.push(x.fNomNivell(sensNom.length === 1 ? sensNom[0] : llista(sensNom, x.i), sensNom.length > 1));
  if (sensConducta.length) f.push(x.fConducta(sensConducta.length === 1 ? sensConducta[0] : llista(sensConducta, x.i), sensConducta.length > 1));
  return f;
}

function exportarPropi(p) {
  return {
    id: p.id, eix: p.eix, nom: p.nom.cat, desc: p.desc,
    opcions: p.opcions.map(o => ({ id: o.id, nom: o.nom.cat, descripcio: o.descripcio.cat, prompt: o.prompt, marcadors: o.marcadors, guia: o.guia }))
  };
}

function normalitzarPropis(llista) {
  const out = [];
  if (!Array.isArray(llista)) return out;
  const text = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
  llista.forEach(r => {
    if (!r || typeof r !== "object" || !Array.isArray(r.opcions) || out.length >= MAX_EIXOS) return;
    if (typeof r.id !== "string" || !/^propi\d+$/.test(r.id) || out.some(p => p.id === r.id)) return;
    if (typeof r.eix !== "string" || !/^E\d+$/.test(r.eix) || Number(r.eix.slice(1)) < 7 || out.some(p => p.eix === r.eix)) return;
    const p = { id: r.id, eix: r.eix, propi: true, actiu: true, nom: tots3(text(r.nom, MAX_NOM_TRET)), desc: text(r.desc, 1500), defecte: "", opcions: [] };
    r.opcions.slice(0, MAX_NIVELLS).forEach(o => {
      if (!o || typeof o !== "object") return;
      const id = typeof o.id === "string" && /^n\d+$/.test(o.id) && !p.opcions.some(x => x.id === o.id) ? o.id : nouNivell(p).id;
      p.opcions.push({ id, nom: tots3(text(o.nom, MAX_NOM_NIVELL)), descripcio: tots3(text(o.descripcio, 200)), etiqueta: "",
        prompt: text(o.prompt, 2000), marcadors: text(o.marcadors, 2000), guia: text(o.guia, 1000) });
    });
    while (p.opcions.length < MIN_NIVELLS) p.opcions.push(nouNivell(p));
    sincronitzarPropi(p);
    out.push(p);
  });
  return out;
}

/* Després de canviar trets o nivells, cap selecció pot apuntar a un nivell que ja no existeix */
function normalitzarSeleccions() {
  estat.sel = normalitzarSel(estat.sel);
  estat.dinSel = normalitzarDin(estat.dinSel);
}


/* Selecció del mode dinàmic: cada eix és «aleatori» o té un nivell fix.
   Per defecte, tots aleatoris menys l'E6, que es queda en Neutral. */
function dinPerDefecte() {
  const s = {};
  totsElsTrets().forEach(a => { s[a.id] = a.eix === "E6" ? a.defecte : ALEATORI; });
  return s;
}

function normalitzarDin(s) {
  const out = dinPerDefecte();
  if (s && typeof s === "object") {
    totsElsTrets().forEach(a => { if (s[a.id] === ALEATORI || opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

const selActual = () => esDinamic() ? estat.dinSel : estat.sel;
const esAleatori = a => esDinamic() && estat.dinSel[a.id] === ALEATORI;

/* Nivell fix de l'eix (0 = primer nivell) */
function nivellFix(a) {
  return Math.max(0, a.opcions.findIndex(o => o.id === selActual()[a.id]));
}

/* L'E6 només s'escriu al prompt si hi pot haver biaix (aleatori o un nivell diferent de Neutral) */
const eixAlPrompt = a => a.eix !== "E6" || esAleatori(a) || nivellFix(a) > 0;
const eixosPrompt = () => tretsVisibles().filter(eixAlPrompt);
const perfilDinamic = () => eixosPrompt().some(esAleatori);

/* Textos de l'eix: els originals o, amb el mode avançat, els editats pel docent */
function perso(a) {
  return esAvancat() ? estat.perso[a.id] || null : null;
}
function textCapcalera(a) {
  if (a.propi) return capcaleraPropi(a);
  const p = perso(a);
  return p && typeof p.capcalera === "string" ? p.capcalera : a.capcalera;
}
function textOpcio(a, o, camp) {
  if (a.propi) return camp === "marcadors" ? o.marcadors || "" : textNet(o[camp]);
  const p = perso(a);
  const v = p && p.opcions && p.opcions[o.id] ? p.opcions[o.id][camp] : undefined;
  return typeof v === "string" ? v : (o[camp] ?? "");
}

/* Marcadors observables d'un nivell, un per línia; «Mai:» marca el que no ha de fer */
function textMarcadors(a, o, sagnat) {
  return textOpcio(a, o, "marcadors").split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => `${sagnat}- ${l.startsWith("Mai:") ? "**Mai:**" + l.slice(4) : l}`).join("\n");
}
function textNormesE6(a) {
  const p = perso(a);
  return p && typeof p.normes === "string" ? p.normes : P_NORMES_E6;
}
const eixEditat = id => !!estat.perso[id] && Object.keys(estat.perso[id]).length > 0;

/* Només es desen els camps que existeixen i són text */
function normalitzarPerso(p) {
  const out = {};
  if (!p || typeof p !== "object") return out;
  ATRIBUTS.forEach(a => {
    const e = p[a.id];
    if (!e || typeof e !== "object") return;
    const net = {};
    if (typeof e.capcalera === "string") net.capcalera = e.capcalera;
    if (a.eix === "E6" && typeof e.normes === "string") net.normes = e.normes;
    if (e.opcions && typeof e.opcions === "object") {
      a.opcions.forEach(o => {
        const v = e.opcions[o.id];
        if (!v || typeof v !== "object") return;
        const nv = {};
        if (typeof v.prompt === "string") nv.prompt = v.prompt;
        if (typeof v.guia === "string") nv.guia = v.guia;
        if (typeof v.marcadors === "string") nv.marcadors = v.marcadors;
        if (Object.keys(nv).length) (net.opcions = net.opcions || {})[o.id] = nv;
      });
    }
    if (Object.keys(net).length) out[a.id] = net;
  });
  return out;
}

const totesLesArees = () => AREES.map(a => a.id);

/* Substitució en un sol pas (el text de l'usuari no es torna a processar) */
function omplir(plantilla, valors) {
  return plantilla.replace(/\{(\w+)\}/g, (m, k) => (k in valors ? String(valors[k]) : m));
}

/* Atzar criptogràfic quan està disponible */
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

const triar = arr => arr[rnd(arr.length)];

function nomAleatori() {
  const genere = rnd(2) ? "f" : "m";
  return { nom: `${triar(NOMS_POOL.prenoms[genere])} ${triar(NOMS_POOL.cognoms)}`, genere };
}

/* Gènere del prenom segons el pool ("f", "m" o null si no és a la llista) */
function generePrenom(nomComplet) {
  const prenom = textNet(nomComplet).split(" ")[0] || "";
  if (NOMS_POOL.prenoms.f.includes(prenom)) return "f";
  if (NOMS_POOL.prenoms.m.includes(prenom)) return "m";
  return null;
}

/* Càrrec en la forma del gènere indicat. Si no se sap, només càrrecs invariables. */
function carrecAleatori(genere, excepte) {
  let pool = genere ? CARRECS.map(c => c[genere]) : CARRECS.filter(c => c.m === c.f).map(c => c.m);
  const alternatives = pool.filter(c => c !== excepte);
  if (alternatives.length) pool = alternatives;
  return triar(pool);
}

function textNet(s) { return (s || "").replace(/\s+/g, " ").trim(); }

/* ===== Selecció i regles ===== */
function selPerDefecte() {
  const s = {};
  totsElsTrets().forEach(a => { s[a.id] = a.defecte; });
  return s;
}

function normalitzarSel(s) {
  const out = selPerDefecte();
  if (s && typeof s === "object") {
    totsElsTrets().forEach(a => { if (opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

/* Una regla s'aplica només si tots els seus trets són visibles */
function reglesAplicables() {
  const ids = tretsVisibles().map(a => a.id);
  return REGLES.filter(r => Object.keys(r.cond).every(k => ids.includes(k)));
}

function reglaViolada(sel, attrId) {
  return reglesAplicables().find(r =>
    (!attrId || attrId in r.cond) &&
    Object.entries(r.cond).every(([a, v]) => sel[a] === v)
  ) || null;
}

function selAleatoria() {
  for (let i = 0; i < 500; i++) {
    const s = { ...estat.sel };
    tretsVisibles().filter(a => a.eix !== "E6").forEach(a => { s[a.id] = a.opcions[rnd(a.opcions.length)].id; });
    if (!reglaViolada(s)) return s;
  }
  return selPerDefecte();
}

function plegar(id, plegat) {

function crearFila(at) {
  const row = document.createElement("div");
  row.className = "trait-row";
  row.dataset.attr = at.id;
  const nom = document.createElement("div");
  nom.className = "trait-name";
  if (esAvancat()) {
    nom.appendChild(controlsSeleccio(nomTret(at), selTrets.ids.has(at.id), v => {
      if (v) selTrets.ids.add(at.id); else selTrets.ids.delete(at.id);
      row.classList.toggle("seleccionat", v);
      renderSeleccioTrets();
    }));
    // En mode de selecció, un clic a la fila marca o desmarca el tret
    row.addEventListener("click", ev => {
      if (!selTrets.actiu || ev.target.closest(".sel-controls")) return;
      const c = row.querySelector(".sel-casella");
      c.checked = !c.checked;
      c.dispatchEvent(new Event("change"));
    });
  }
  const etiqueta = document.createElement("span");
  etiqueta.textContent = nomTret(at);
  if (at.propi && !textNet(at.nom.cat)) etiqueta.className = "sense-nom";
  nom.appendChild(etiqueta);
  if (esAvancat()) {
    // v0.6.4: editar (⚙) i eliminar (−). Eliminar és reversible: el tret passa a «Trets eliminats».
    const accions = document.createElement("span");
    accions.className = "trait-accions";
    const g = document.createElement("button");
    g.type = "button";
    g.className = "gear-btn";
    g.innerHTML = ICONA_ENGRANATGE;
    g.addEventListener("click", () => obrirEditor(at.id));
    const m = document.createElement("button");
    m.type = "button";
    m.className = "gear-btn minus-btn";
    m.innerHTML = ICONA_MENYS;
    m.title = v06().ttTreure;
    m.setAttribute("aria-label", `${v06().ttTreure}: ${nomTret(at)}`);
    m.addEventListener("click", () => eliminarTret(at.id));
    accions.append(g, m);
    nom.appendChild(accions);
  }
  const grid = document.createElement("div");
  grid.className = "seg-grid no-anim";
  grid.style.setProperty("--nl", at.opcions.length);
  const indicador = document.createElement("span");
  indicador.className = "seg-indicator";
  indicador.setAttribute("aria-hidden", "true");

  row.appendChild(grid);

}

/* Construeix les files només quan canvien els trets visibles o l'idioma.
   Si no, actualitza les existents perquè l'indicador taronja pugui lliscar. */
function renderTrets(forcar) {
  const cont = $("traitsContainer");
  const firmaTret = a => a.propi ? `${a.id}:${a.nom.cat}/${a.opcions.map(o => o.id + "=" + o.nom.cat).join(",")}` : a.id;
  const firma = [currentLang, esAvancat(), selTrets.actiu, tretsVisibles().map(firmaTret).join(";")].join("|");
  if (!forcar && firma === firmaTrets && cont.children.length) { actualitzarTrets(); return; }
  firmaTrets = firma;
  cont.innerHTML = "";

  tretsVisibles().forEach(at => {
    const { row, grid } = crearFila(at);
    row.classList.toggle("seleccionat", selTrets.actiu && selTrets.ids.has(at.id));
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", at.nom[currentLang]);

    opcionsFila(at).forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = o.id === ALEATORI ? "seg-btn seg-random" : "seg-btn";
      b.dataset.opt = o.id;
      b.textContent = o.id === ALEATORI ? t().segRandom : nomNivell(o, at.opcions.indexOf(o));
      b.addEventListener("click", () => {
        const mapa = selActual();
        if (b.getAttribute("aria-disabled") === "true" || mapa[at.id] === o.id) return;
        mapa[at.id] = o.id;
        actualitzarTrets();
        renderAvis();
        refrescarVistes();
      });
      grid.appendChild(b);
    });

    const desc = document.createElement("div");
    desc.className = "trait-desc";
    row.appendChild(desc);
    cont.appendChild(row);
  });

  actualitzarTrets(true);
  // Primer dibuix sense animació; a partir d'aquí l'indicador llisca
  const reactivar = () => cont.querySelectorAll(".seg-grid.no-anim").forEach(g => g.classList.remove("no-anim"));
  if (window.requestAnimationFrame) requestAnimationFrame(() => requestAnimationFrame(reactivar));
  else reactivar();
}

/* Descripció que surt sota cada eix */
function descripcioEix(at) {
  const x = t();
  const sel = selActual()[at.id];
  if (at.propi && faltesPropi(at).length) return v06().tretIncomplet;
  let text = sel === ALEATORI
    ? omplir(x.descRandom, { n: at.opcions.length })
    : opcio(at.id, sel)?.descripcio[currentLang] || "";
  return text;
}

function actualitzarTrets(inicial) {
  const cont = $("traitsContainer");
  const din = esDinamic();
  const mapa = selActual();
  tretsVisibles().forEach(at => {
    const row = cont.querySelector(`[data-attr="${at.id}"]`);
    if (!row) return;
    // Posició de l'indicador: amb el mode dinàmic, la columna 0 és «Aleatori»; sense, té amplada zero
    const k = at.opcions.findIndex(o => o.id === mapa[at.id]);
    const idx = din ? (mapa[at.id] === ALEATORI ? 0 : k + 1) : Math.max(0, k);
    const grid = row.querySelector(".seg-grid");
    grid.style.setProperty("--i", idx);
    grid.style.setProperty("--N", at.opcions.length + (din ? 1 : 0));
    const ra = row.querySelector(".seg-random");
    ra.tabIndex = din ? 0 : -1;
    ra.setAttribute("aria-hidden", din ? "false" : "true");
    grid.classList.toggle("is-random", mapa[at.id] === ALEATORI);

    const g = row.querySelector(".gear-btn");
    if (g) {
      const editat = eixEditat(at.id);
      g.classList.toggle("edited", editat);
      g.title = editat ? t().ttGearEdited : t().ttGear;
      g.setAttribute("aria-label", `${g.title}: ${at.nom[currentLang]}`);
    }

    row.querySelectorAll(".seg-btn").forEach(b => {
      const id = b.dataset.opt;
      const actiu = mapa[at.id] === id;
      b.setAttribute("aria-pressed", actiu ? "true" : "false");
      if (id === ALEATORI) {
        b.title = omplir(t().descRandom, { n: at.opcions.length });
        return;
      }
      const o = opcio(at.id, id);
      const regla = actiu || din ? null : reglaViolada({ ...estat.sel, [at.id]: o.id }, at.id);
      if (regla) {
        b.setAttribute("aria-disabled", "true");
        b.title = t().ttIncompat + regla.motiu[currentLang];
      } else {
        b.removeAttribute("aria-disabled");
        b.title = o.descripcio[currentLang];
      }
    });

    const desc = row.querySelector(".trait-desc");
    const text = descripcioEix(at);
    desc.classList.toggle("avis", !!at.propi && faltesPropi(at).length > 0);
    if (desc.textContent === text) return;
    if (inicial) { desc.textContent = text; return; }
    desc.classList.add("fade");
    clearTimeout(desc._t);
    desc._t = setTimeout(() => { desc.textContent = text; desc.classList.remove("fade"); }, 140);
  });
}

/* ===== Mode avançat: editor dels textos d'un eix ===== */
function valorEditor(a, camp, optId) {
  if (camp === "capcalera") return textCapcalera(a);
  if (camp === "normes") return textNormesE6(a);
  return textOpcio(a, opcio(a.id, optId), camp);
}

function valorOriginal(a, camp, optId) {
  if (camp === "capcalera") return a.capcalera;
  if (camp === "normes") return P_NORMES_E6;
  return opcio(a.id, optId)[camp] ?? "";
}

/* Desa només el que difereix de l'original */
function desarCampEditor(a, camp, optId, valor) {
  const original = valorOriginal(a, camp, optId);
  const p = estat.perso[a.id] || {};
  if (camp === "capcalera" || camp === "normes") {
    if (valor === original) delete p[camp]; else p[camp] = valor;
  } else {
    const ops = p.opcions || {};
    const o = ops[optId] || {};
    if (valor === original) delete o[camp]; else o[camp] = valor;
    if (Object.keys(o).length) ops[optId] = o; else delete ops[optId];
    if (Object.keys(ops).length) p.opcions = ops; else delete p.opcions;
  }
  if (Object.keys(p).length) estat.perso[a.id] = p; else delete estat.perso[a.id];
  $("edReset").disabled = !eixEditat(a.id);
  actualitzarTrets();
  refrescarVistes();
}

/* ===== Gestió dels trets (mode avançat, v0.6.4) =====
   Sota la llista: «Afegir tret» i els trets eliminats, que es poden recuperar.
   Els trets propis eliminats també es poden esborrar del tot (amb doble clic). */
/* Un tret propi sense res escrit no val la pena recuperar-lo: s'esborra del tot */
function tretPropiBuit(a) {
  return !!a && a.propi && !textNet(a.nom.cat) && !textNet(a.desc)
    && a.opcions.every(o => !textNet(o.nom.cat) && !textNet(o.descripcio.cat) && !textNet(o.prompt) && !textNet(o.marcadors) && !textNet(o.guia));
}

function eliminarTret(id) {
  if (estat.eliminats.includes(id)) return;
  if (tretPropiBuit(tret(id))) { esborrarTretPropi(id); return; }
  estat.eliminats.push(id);
  renderitzar();
  const afegir = $("traitsManage").querySelector(".paperera button");
  if (afegir) afegir.focus();
}

function recuperarTret(id) {
  if (tretsVisibles().length >= MAX_EIXOS) return;
  estat.eliminats = estat.eliminats.filter(x => x !== id);
  renderitzar();
  destacarFila(id);
}

function esborrarTretPropi(id) {
  estat.propis = estat.propis.filter(p => p.id !== id);
  estat.eliminats = estat.eliminats.filter(x => x !== id);
  delete estat.sel[id];
  delete estat.dinSel[id];
  renderitzar();
}

function destacarFila(id) {
  const row = document.querySelector(`.trait-row[data-attr="${id}"]`);
  if (!row) return;
  row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  row.classList.remove("destacat"); void row.offsetWidth; row.classList.add("destacat");
}

function renderGestioTrets() {
  const cont = $("traitsManage");
  cont.hidden = !esAvancat() || selTrets.actiu;
  if (cont.hidden) { cont.replaceChildren(); return; }
  const x = v06(), ple = tretsVisibles().length >= MAX_EIXOS;

  const afegir = document.createElement("button");
  afegir.type = "button";
  afegir.className = "add-btn";
  afegir.innerHTML = ICONA_MES;
  afegir.append(x.afegirTret);
  afegir.disabled = ple;
  if (ple) afegir.title = x.maxTrets(MAX_EIXOS);
  afegir.addEventListener("click", afegirTretNou);
  const parts = [afegir];

  const eliminats = tretsEliminats();
  if (eliminats.length) parts.push(paperera(x.tretsEliminats, eliminats.map(a => ({
    nom: nomTret(a), etiqueta: a.eix, propi: !!a.propi,
    recuperar: () => recuperarTret(a.id), potRecuperar: !ple, titolNo: x.maxRecuperar(MAX_EIXOS),
    esborrar: () => esborrarTretPropi(a.id)
  }))));
  cont.replaceChildren(...parts);
}

/* Fila d'elements eliminats (trets o criteris): cada un es pot recuperar; els propis, també esborrar del tot */

/* ===== Editor d'un eix (mode avançat) =====
   Trets de base: es pot editar el text que aporten al prompt (com fins ara).

/* Camp de text de l'editor de trets propis. «multi» = textarea. */
function campPropi(pare, etiqueta, valor, opts, enCanvi) {
  const id = `edp_${opts.id}`;
  const l = document.createElement("label");
  l.className = "ed-label";
  l.htmlFor = id;
  l.textContent = etiqueta;
  const el = document.createElement(opts.multi ? "textarea" : "input");
  if (!opts.multi) el.type = "text";
  el.id = id;
  el.value = valor;
  if (opts.max) el.maxLength = opts.max;
  if (opts.ph) el.placeholder = opts.ph;
  if (opts.multi) el.rows = Math.min(10, Math.max(opts.rows || 2, Math.ceil(valor.length / 90) + 1));
  el.addEventListener("input", () => enCanvi(el.value));
  pare.append(l, el);
  return el;
}

    nomNiv.value = o.nom.cat;
    nomNiv.maxLength = MAX_NOM_NIVELL;
    nomNiv.placeholder = y.edNomNivell;
    nomNiv.setAttribute("aria-label", `${y.edNomNivell} ${k + 1}`);
    nomNiv.addEventListener("input", () => { o.nom = tots3(nomNiv.value); canvi(); });
    head.append(num, nomNiv);
    if (a.opcions.length > MIN_NIVELLS) {
      const tr = document.createElement("button");
      tr.type = "button";
      tr.className = "gear-btn minus-btn";
      tr.innerHTML = ICONA_CREU;
      tr.title = y.edTreureNivell;
      tr.setAttribute("aria-label", `${y.edTreureNivell} ${k + 1}`);
      tr.addEventListener("click", () => {
        a.opcions.splice(k, 1);
        sincronitzarPropi(a);
        tretPropiCanviat();
        renderEditor();
      });
      head.appendChild(tr);
    }
    sec.appendChild(head);
    campPropi(sec, y.edDescNivell, o.descripcio.cat, { id: `dc_${o.id}`, max: 200 }, v => { o.descripcio = tots3(v); canvi(); });
    campPropi(sec, y.edConductaReq, o.prompt, { id: `pr_${o.id}`, multi: true, rows: 3, max: 2000 }, v => { o.prompt = v; canvi(); });
    campPropi(sec, x.edMarkers, o.marcadors, { id: `mk_${o.id}`, multi: true, max: 2000 }, v => { o.marcadors = v; canvi(); });
    campPropi(sec, x.edGuide, o.guia, { id: `gu_${o.id}`, multi: true, max: 1000 }, v => { o.guia = v; canvi(); });
    body.appendChild(sec);
  });

  if (a.opcions.length < MAX_NIVELLS) {
    const mes = document.createElement("button");
    mes.type = "button";
    mes.className = "add-btn";
    mes.innerHTML = ICONA_MES;
    mes.append(y.edAfegirNivell);
    mes.addEventListener("click", () => {
      const o = nouNivell(a);
      a.opcions.push(o);
      sincronitzarPropi(a);
      tretPropiCanviat();
      renderEditor();
      const el = $(`edp_nn_${o.id}`);
      if (el) { el.focus(); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
    });
    body.appendChild(mes);
  }
  actualitzarEstatEditor();
}

/* v0.6.3: confirmació sense finestres del navegador. El primer clic canvia el text del botó
   («Segur? Torna a clicar») i només el segon, dins d'uns segons, fa l'acció. Si no, el botó torna a ser com era.
   inici / fi: opcionals, per mostrar i treure un avís mentre s'espera el segon clic. */
function confirmarAmbDobleClic(btn, text, accio, inici, fi) {
  const restaurar = () => {
    clearTimeout(btn._t);
    if (btn.classList.contains("confirmant")) btn.innerHTML = btn.dataset.original;
    btn.classList.remove("confirmant");
    if (fi) fi();
  };
  if (btn.classList.contains("confirmant")) { restaurar(); accio(); return; }
  btn.dataset.original = btn.innerHTML;
  btn.innerHTML = text;
  btn.classList.add("confirmant");
  if (inici) inici();
  btn._t = setTimeout(restaurar, 3500);
}

function restaurarEixEditor(btn) {
  const a = tret(eixEditor);
  if (!a || !eixEditat(a.id)) return;
  if (btn) { confirmarAmbDobleClic(btn, t().edConfirmReset, () => restaurarEixEditor()); return; }
  delete estat.perso[a.id];
  renderEditor();
  actualitzarTrets();
  refrescarVistes();
}

/* Omple el cas amb un exemple diferent de l'actual. Si el cas s'ha editat a mà, demana confirmació. */
let casActual = 0;
function casAleatori(btn) {
  const oberta = $("infoOberta").value.trim();
  const oculta = $("infoOculta").value.trim();
  const esExemple = CASOS_EXEMPLE.some(c => c.infoOberta === oberta && c.infoOculta === oculta);
  if (btn && (oberta || oculta) && !esExemple) { confirmarAmbDobleClic(btn, t().confirmRandomCase, () => casAleatori()); return; }
  let i;
  do { i = rnd(CASOS_EXEMPLE.length); } while (i === casActual && CASOS_EXEMPLE.length > 1);
  casActual = i;
  const c = CASOS_EXEMPLE[i];
  $("assistantName").value = c.nomIntern;
  $("companyName").value = c.empresa;
  $("infoOberta").value = c.infoOberta;
  $("infoOculta").value = c.infoOculta;
  refrescarVistes();
}

/* ===== Compilació del prompt ===== */
function idiomesSeleccionats() {
  const s = [];
  if ($("lang_cat").checked) s.push({ id: "cat", nom: "català" });
  if ($("lang_es").checked) s.push({ id: "es", nom: "castellà" });
  if ($("lang_en").checked) s.push({ id: "en", nom: "anglès" });
  return s;
}

/* "català", "català o castellà", "català, castellà o anglès" */
/* "català", "català i castellà", "català, castellà i anglès" */
function llista(noms, conj) {
  return noms.length < 2 ? noms.join("") : `${noms.slice(0, -1).join(", ")} ${conj} ${noms.at(-1)}`;
}

const NOMBRES = ["zero", "un", "dos", "tres", "quatre", "cinc", "sis", "set", "vuit", "nou", "deu"];

/* v0.6.4: l'eix és al prompt (els eixos de base es poden treure en mode avançat) */
const teEix = codi => eixosPrompt().some(a => a.eix === codi);

/* «E1 a E6» si són seguits; si n'hi falta algun, la llista («E1, E2, E4 i E7») */
function textRangEixos(eixos) {
  const n = eixos.map(a => Number(a.eix.slice(1)));
  const seguits = n.every((v, i) => i === 0 || v === n[i - 1] + 1);
  return seguits && eixos.length > 1 ? `${eixos[0].eix} a ${eixos.at(-1).eix}` : llista(eixos.map(a => a.eix), "i");
}

/* Funció de l'eix a la llista de 7.x; per als trets propis, el seu nom */
const funcioEix = a => FUNCIO_EIX[a.eix] && !a.propi ? FUNCIO_EIX[a.eix] : textNet(a.nom.cat).toLowerCase();

function compilarIdioma() {
  const sel = idiomesSeleccionats();
  // v0.6.4: sense cap idioma marcat, el client respon en l'idioma de l'alumne (abans: català)
  if (sel.length === 0) return P_IDIOMA_USUARI;
  const inici = sel[0].nom;
  if (!$("forceLanguages").checked) return omplir(P_IDIOMA_LLIURE, { inici });
  if (sel.length === 1) return omplir(P_IDIOMA_FORCAT_UN, { inici });
  return omplir(P_IDIOMA_FORCAT_DIVERSOS, { inici, permesos: llista(sel.map(l => l.nom), "i") });
}

function nomOrganitzacio() {
  const e = textNet($("companyName").value);
  return e ? `«${e}»` : "l'organització que encarrega el projecte";
}

function textArees() {
  let arees = AREES.filter(a => estat.arees.includes(a.id));
  if (!arees.length) arees = AREES;
  return arees.map(a => `   - *${a.prompt}:* ${a.llista}.`).join("\n");
}

function compilarIdentitat() {
  const nom = textNet($("charName").value);
  const carrec = textNet($("charRole").value);
  if (identitatAleatoria() || (!nom && !carrec)) {
    return omplir(P_IDENTITAT_DINAMICA, { organitzacio: nomOrganitzacio(), abast: P_ABAST, arees: textArees() });
  }
  return omplir(P_IDENTITAT_FIXA, {
    organitzacio: nomOrganitzacio(),
    nom: nom || "tria'l tu, de manera coherent amb el càrrec",
    carrec: carrec || "tria'l tu, de manera coherent amb el cas",
    abast: P_ABAST
  });
}

function tretLliureActiu() {
  return textNet($("freeTrait").value).slice(0, TRET_LLIURE.maxCaracters);
}

/* L'E6 surt al prompt (i s'avalua H1) només si hi pot haver biaix */
const ambE6 = () => eixosPrompt().some(a => a.eix === "E6");

/* Llista de columnes de la llavor, només amb els eixos que se sortegen */
function textColumnes(aleatoris) {
  return aleatoris.map((a, j) =>
    `      - ${a.eix}: la ${ORDINALS_COLUMNA[j]} columna${j === 0 ? " (el primer dígit de cada bloc)" : ""}`
  ).join("\n");
}

/* Format de la línia CALC, amb lletres perquè el model no copiï dígits d'exemple */
function textExempleCalc(aleatoris) {
  const primer = `${aleatoris[0].eix} a+b+c+d=suma→nivell`;
  return aleatoris.length > 1 ? `${primer}; ${aleatoris[1].eix} …; …` : primer;
}

/* «3 per a E1, E2 i E3; 4 per a E4», segons el nombre de nivells de cada eix aleatori */
function textDivisors(aleatoris) {
  const grups = {};
  aleatoris.forEach(a => { (grups[a.opcions.length] = grups[a.opcions.length] || []).push(a.eix); });
  return Object.keys(grups).sort().map(n => `${n} per a ${llista(grups[n], "i")}`).join("; ");
}

function compilarPerfil() {
  const eixos = eixosPrompt();
  const aleatoris = eixos.filter(esAleatori);
  const din = aleatoris.length > 0;
  const parts = [];

  // v0.6.4: sense cap eix al prompt (p. ex., només queda l'E6 en Neutral)
  if (!eixos.length) {
    parts.push(P_PERFIL_SENSE_EIXOS);
    const lliure = tretLliureActiu();
    if (lliure) parts.push(omplir(P_TRET_LLIURE, { text: lliure }));
    parts.push(omplir(P_COMPROVACIO, { num: "7.1" }));
    return parts.join("\n\n");
  }

  parts.push(omplir(din ? P_PERFIL_INTRO_DINAMIC : P_PERFIL_INTRO_FIX, {
    eixosText: eixos.length === 1 ? `un eix (${eixos[0].eix})` : `${NOMBRES[eixos.length] || eixos.length} eixos (${textRangEixos(eixos)})`,
    cadascun: eixos.length === 1 ? "," : ", cadascun"
  }));

  let num = 1;
  if (din) {
    const fixos = eixos.filter(a => !esAleatori(a));
    const rangs = llista(aleatoris.map(a => `${a.eix} 1–${a.opcions.length}`), "i");
    const nivell = a => `${nivellFix(a) + 1} (${a.opcions[nivellFix(a)].etiqueta.replace(/\s*\(.*\)$/, "")})`;
    let pas2 = omplir(P_SORTEIG_TOT, { rangs });
    if (fixos.length) {
      pas2 = omplir(P_SORTEIG_PARCIAL, {
        rangs,
        fixos: fixos.length === 1
          ? omplir(P_FIX_UN, { eix: fixos[0].eix, nivell: nivell(fixos[0]) })
          : omplir(P_FIX_DIVERSOS, { eixos: llista(fixos.map(a => a.eix), "i"), nivells: llista(fixos.map(a => `${a.eix} = ${nivell(a)}`), "i") }),
        escriu: fixos.length === 1 ? P_ESCRIU_UN : P_ESCRIU_DIVERSOS,
        exemple: eixos.map(a => esAleatori(a) ? "x" : nivellFix(a) + 1).join("-")
      });
    }
    parts.push(omplir(P_OBTENCIO, {
      format: eixos.map(a => a.eix).join("-"),
      pas2,
      quins: fixos.length ? P_QUINS_PARCIAL : P_QUINS_TOT,
      linTorn: tancament().actiu ? " Posa la línia TORN (secció 8) just a sota de la línia PERFIL, abans de la línia en blanc." : "",
      columnes: textColumnes(aleatoris),
      divisors: textDivisors(aleatoris),
      exempleCalc: textExempleCalc(aleatoris),
      ...formatLlavor(aleatoris.length)
    }));
    num = 2;
  }

  parts.push(omplir(P_APLICACIO, {
    num: `7.${num}`,
    funcions: eixos.map(a => `${a.eix} ${funcioEix(a)}`).join("; "),
    combina: teEix("E4") && teEix("E5") ? ": E5 governa què es revela i E4 com s'expressa" : ""
  }));

  eixos.forEach(a => {
    let bloc = `#### ${a.eix} — ${textCapcalera(a)}\n\n`;
    if (esAleatori(a)) {
      bloc += a.opcions.map((o, k) => {
        const m = textMarcadors(a, o, "   ");
        return `${k + 1}. **${o.etiqueta}.** ${textOpcio(a, o, "prompt")}${textGuia(a, o)}` + (m ? "\n" + m : "");
      }).join("\n");
    } else {
      const k = nivellFix(a);
      const o = a.opcions[k];
      const titol = din ? P_NIVELL_FIX_DINAMIC : "Nivell assignat";
      bloc += `${titol}: **${k + 1}. ${o.etiqueta}.** ${textOpcio(a, o, "prompt")}${textGuia(a, o)}`;
      const m = textMarcadors(a, o, "");
      if (m) bloc += "\n\n" + m;
    }
    if (a.eix === "E6") bloc += "\n\n" + textNormesE6(a);
    parts.push(bloc);
  });

  const lliure = tretLliureActiu();
  if (lliure) parts.push(omplir(P_TRET_LLIURE, { text: lliure }));

  parts.push(textNormesManifestacio());
  parts.push(P_NORMES_PERFIL);
  parts.push(omplir(P_COMPROVACIO, { num: `7.${num + 1}` }));
  return parts.join("\n\n");
}

function compilarSystemPrompt() {
  const din = perfilDinamic();
  const tc = tancament().actiu;
  return [
    P_FUNCIO,
    compilarIdioma(),
    compilarIdentitat(),
    omplir(P_CAS, { infoOberta: $("infoOberta").value.trim(), infoOculta: $("infoOculta").value.trim() }),
    omplir(P_INFORMACIO, { liniaE5: teEix("E5") ? P_LINIA_E5 : "" }),
    P_REQUISITS,
    compilarPerfil(),
    omplir(P_CONDUCCIO, {
      liniaPerfil: din
        ? (tc ? "línia de llavor, línia de càlcul, línia de perfil i línia de torn, " : "línia de llavor, línia de càlcul i línia de perfil, ")
        : (tc ? "línia de torn, " : ""),
      llargada: teEix("E4") ? P_LLARGADA_E4 : P_LLARGADA_SENSE_E4,
      e2: teEix("E2") ? P_E2_ETICA : "",
      e3: teEix("E3") ? P_E3_AUTORITAT : ""
    }) + (tc ? "\n\n" + textDurada(din) : ""),
    textAvaluacio(din, tc)
  ].join("\n\n---\n\n");
}

/* Secció 9: límits del rol, finalització i avaluació (rúbrica i fases configurables) */
function textAvaluacio(din, tc) {
  const comanda = codiAvaluacio();
  const liniaPerfilAval = din
    ? (tc ? "no escrius les línies de llavor, de càlcul, de perfil ni de torn, " : "no escrius les línies de llavor, de càlcul ni de perfil, ")
    : (tc ? "no escrius la línia de torn, " : "");
  const rub = textosRubrica();
  return omplir(P_AVALUACIO, {
    comanda,
    finalitzacio: tc ? P_FINAL_TORNS : P_FINAL_LLIURE,
    notaResum: tc && teCriteri("F") && estat.fases.resum ? omplir(P_NOTA_RESUM, lletresPrompt()) : "",
    notaE6: hActiu() && !ambE6() ? P_NOTA_SENSE_E6 : "",
    notaObservacio: estat.fases.observacio ? P_NOTA_OBSERVACIO : "",
    estats: textEstats(comanda, liniaPerfilAval),
    informe: textInforme({ ...rub, ref: textRef() }),
    ...rub
  });
}

/* Guia de maneig entre parèntesis (si un tret propi no en té, no s'escriu) */
function textGuia(a, o) {
  const g = textOpcio(a, o, "guia");
  return g ? ` *(Guia: ${g})*` : "";
}

/* Mida de la llavor: cinc blocs de 6 dígits; amb més de 6 eixos aleatoris, un dígit més per eix */
function formatLlavor(nAleatoris) {
  const mida = Math.max(6, nAleatoris);
  return { nDigits: 5 * mida, midaBloc: NOMBRES[mida], formatLlavor: Array(5).fill("d".repeat(mida)).join(" ") };
}

/* Normes de manifestació: el punt 2 parla de l'E4, l'E5 i l'E1, i el 3 d'un client Dominant (E4) */
function textNormesManifestacio() {
  const sempre = [teEix("E4") && P_MARCADORS_E4, teEix("E5") && P_MARCADORS_E5].filter(Boolean);
  const tema = eixosPrompt().filter(a => (a.eix === "E1" || a.propi) && a.opcions.some(o => textOpcio(a, o, "marcadors").trim())).map(a => `d'${a.eix}`);
  let punt2 = "";
  if (sempre.length && tema.length) punt2 = `Els marcadors ${llista(sempre, "i")} s'apliquen a totes les intervencions; els ${llista(tema, "i")}, sempre que el tema ho permeti.`;
  else if (sempre.length) punt2 = `Els marcadors ${llista(sempre, "i")} s'apliquen a totes les intervencions.`;
  else if (tema.length) punt2 = `Els marcadors ${llista(tema, "i")} s'apliquen sempre que el tema ho permeti.`;
  return omplir(P_NORMES_MANIFESTACIO, {
    punt2: punt2 ? `2. ${punt2}\n` : "",
    n3: punt2 ? 3 : 2,
    n4: punt2 ? 4 : 3,
    dominant: teEix("E4") && opcio("estil", "dominant") ? P_DOMINANT : ""
  });
}

   El prompt es divideix en pàgines pels separadors «---» de les seccions i es mostra amb format.
   El mode de text pla continua sent el d'abans. */
let modeVisor = "lectura", paginesVisor = [], paginaVisor = 0;

const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function mdInline(s) {
  const codis = [];
  s = escHtml(s).replace(/`([^`]+)`/g, (m, c) => { codis.push(c); return `\u0000${codis.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, k) => `<code>${codis[k]}</code>`);
}

/* Markdown → HTML (només el que fa servir el prompt: títols, llistes, taules, paràgrafs i línies ocultes) */
function mdAHtml(md) {
  const linies = md.split("\n"), out = [];
  let par = [], pila = [];
  const tancarPar = () => { if (par.length) { out.push(`<p>${par.map(mdInline).join("<br>")}</p>`); par = []; } };
  const tancarLlistes = (fins = 0) => { while (pila.length > fins) { const l = pila.pop(); out.push(`</li></${l.tipus}>`); } };
  for (let i = 0; i < linies.length; i++) {
    const l = linies[i];
    let m;
    if (!l.trim()) { tancarPar(); tancarLlistes(); continue; }
    if ((m = l.match(/^\[\/\/\]: # \((.*)\)$/))) {
      tancarPar(); tancarLlistes();
      out.push(`<div class="md-ocult"><span>${escHtml(v06().liniaOculta)}</span><code>${escHtml(m[1])}</code></div>`);
      continue;
    }
    if ((m = l.match(/^(#{1,4}) (.*)$/))) {
      tancarPar(); tancarLlistes();
      const n = Math.max(2, Math.min(m[1].length, 5));
      out.push(`<h${n}>${mdInline(n === 2 ? senseMajuscules(m[2]) : m[2])}</h${n}>`);
      continue;
    }
    if (l.startsWith("|")) {
      tancarPar(); tancarLlistes();
      const files = [];
      while (i < linies.length && linies[i].startsWith("|")) files.push(linies[i++]);
      i--;
      const cel = f => f.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const cap = cel(files[0]), cos = files.slice(files[1] && /^\|[\s:|-]+\|$/.test(files[1]) ? 2 : 1);
      out.push(`<div class="md-taula"><table><thead><tr>${cap.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${cos.map(f => `<tr>${cel(f).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if ((m = l.match(/^(\s*)([-*]|\d+\.) (.*)$/))) {
      tancarPar();
      const nivell = Math.floor(m[1].length / 2), tipus = /\d/.test(m[2]) ? "ol" : "ul";
      while (pila.length > nivell + 1) { const x = pila.pop(); out.push(`</li></${x.tipus}>`); }
      if (pila.length === nivell + 1 && pila.at(-1).tipus !== tipus) { const x = pila.pop(); out.push(`</li></${x.tipus}>`); }
      if (pila.length === nivell + 1) out.push("</li><li>");
      else { while (pila.length < nivell + 1) { pila.push({ tipus }); out.push(`<${tipus}${tipus === "ol" ? ` start="${parseInt(m[2], 10) || 1}"` : ""}><li>`); } }
      out.push(mdInline(m[3]));
      continue;
    }
    if (pila.length) { out.push("<br>" + mdInline(l.trim())); continue; }
    par.push(l);
  }
  tancarPar(); tancarLlistes();
  return out.join("");
}

/* «7. PERFIL CONDUCTUAL» → «7. Perfil conductual» */
function senseMajuscules(t) {
  if (t !== t.toLocaleUpperCase("ca")) return t;
  const n = t.match(/^(\d+\.\s*)?(.*)$/);
  return (n[1] || "") + n[2].charAt(0) + n[2].slice(1).toLocaleLowerCase("ca");
}

}
