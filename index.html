function tancarVisor() {
  $("visorOverlay").classList.remove("open");
  $("promptViewerBox").style.display = "none";
}

/* ===== Desat automàtic del treball en curs (localStorage) =====
   Només es desa si algun camp de text és diferent del de l'inici: tocar interruptors o nivells
   no ho justifica. Quan es desa, es desa tot el client. En descarregar o copiar, s'esborra. */
const CLAU_ESBORRANY = "generador_esborrany";
const CAMPS_TEXT = ["assistantName", "companyName", "infoOberta", "infoOculta", "charName", "charRole", "freeTrait", "evalCode"];
let textInicial = null;        // camps de text tal com eren en obrir la pàgina (o en l'última exportació)
let esborranyPendent = null;   // esborrany trobat en obrir, a l'espera que el professor decideixi
let temporitzadorDesat = null;

const instantaniaText = () => Object.fromEntries(CAMPS_TEXT.map(id => [id, $(id).value.trim()]));

function hiHaTextModificat() {
  if (!textInicial) return false;
  if (CAMPS_TEXT.some(id => $(id).value.trim() !== textInicial[id])) return true;
  if (estat.propis.length || estat.eliminats.length || estat.ordre.length || rubricaModificada() || !fasesTotes()) return true;
  return Object.values(estat.perso || {}).some(p => p && Object.keys(p).length > 0);
}

function desarEsborrany() {
  clearTimeout(temporitzadorDesat);
  temporitzadorDesat = setTimeout(() => {
    try {
      if (hiHaTextModificat()) {
        localStorage.setItem(CLAU_ESBORRANY, JSON.stringify({ desat: Date.now(), versio: VERSIO, dades: generarEstructuraJSON() }));
      } else if (!esborranyPendent) {
        localStorage.removeItem(CLAU_ESBORRANY);
      }
    } catch (e) { /* sense localStorage, simplement no es desa */ }
  }, 600);
}

/* Després d'exportar, la feina ja és en un fitxer: fora l'esborrany i nou punt de partida */
function feinaExportada() {
  clearTimeout(temporitzadorDesat);
  textInicial = instantaniaText();
  if (!esborranyPendent) { try { localStorage.removeItem(CLAU_ESBORRANY); } catch (e) {} }
}

function llegirEsborrany() {
  try {
    const e = JSON.parse(localStorage.getItem(CLAU_ESBORRANY) || "null");
    return e && e.dades && (e.dades._config || e.dades.system_prompt) ? e : null;
  } catch (err) { return null; }
}

function renderAvisEsborrany() {
  const avis = $("esborranyAvis");
  avis.hidden = !esborranyPendent;
  if (!esborranyPendent) return;
  const x = v06(), d = esborranyPendent.dades;
  const c = d._config || {};
  const fitxer = textNet(d.name || "");
  const nom = textNet(c.empresa || "") || (fitxer && fitxer !== "client" ? fitxer : "") || textNet(c.charName || "") || x.esbSenseNom;
  const data = new Date(esborranyPendent.desat).toLocaleString(x.locale, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  $("esborranyText").textContent = x.esbText(nom, data);
  $("esborranyRecuperar").textContent = x.esbRecuperar;
  $("esborranyDescartar").textContent = x.esbDescartar;
}

function recuperarEsborrany() {
  if (!esborranyPendent) return;
  const dades = esborranyPendent.dades;
  esborranyPendent = null;
  try { carregarDadesClient(dades); } catch (e) { console.error("No s'ha pogut recuperar l'esborrany:", e); }
  renderAvisEsborrany();
  desarEsborrany();
}

function descartarEsborrany() {
  esborranyPendent = null;
  renderAvisEsborrany();
  if (!hiHaTextModificat()) { try { localStorage.removeItem(CLAU_ESBORRANY); } catch (e) {} }
}

/* ===== v0.6.4: rúbrica de l'avaluació =====
   estat.rubrica = { criteris: [...], eliminats: [lletres] }
   Cada criteri: { id, nom, pes, que, desc: null | { intro, nivells[5] {d, ex}, sostre }, biaix (només H), propi }
   Els criteris trets es queden a «criteris» (per poder-los recuperar) i la seva lletra va a «eliminats». */
const MAX_CRITERIS = 12;
const LLETRES_PROPIES = "JKLMNOPQRSTUVWXYZ";
const MAX_NOM_CRITERI = 80, MAX_QUE_CRITERI = 400, MAX_TEXT_NIVELL = 600;
const copiaJSON = o => JSON.parse(JSON.stringify(o));
const nivellsBuits = () => Array.from({ length: 5 }, () => ({ d: "", ex: "" }));

function normalitzarNivells(n, base) {
  const out = base ? copiaJSON(base) : nivellsBuits();
  if (Array.isArray(n)) n.slice(0, 5).forEach((v, k) => {
    if (!v || typeof v !== "object") return;
    if (typeof v.d === "string") out[k].d = v.d.slice(0, MAX_TEXT_NIVELL);
    if (typeof v.ex === "string") out[k].ex = v.ex.slice(0, MAX_TEXT_NIVELL);
  });
  return out;
}

function normalitzarDesc(d, base) {
  if (!d || typeof d !== "object") return null;
  const b = base || { intro: "", nivells: nivellsBuits(), sostre: "" };
  return {
    intro: typeof d.intro === "string" ? d.intro.slice(0, 1500) : b.intro,
    nivells: normalitzarNivells(d.nivells, b.nivells),
    sostre: typeof d.sostre === "string" ? d.sostre.slice(0, 400) : b.sostre
  };
}

function criteriBase(c) {
  return { id: c.id, nom: c.nom, pes: c.pes, que: c.que, desc: c.desc ? copiaJSON(c.desc) : null, ...(c.biaix ? { biaix: copiaJSON(c.biaix) } : {}), propi: false };
}

const pesValid = p => { const n = parseInt(p, 10); return Number.isFinite(n) ? Math.min(Math.max(n, 1), 100) : null; };

/* Llegeix una rúbrica d'un JSON (o null → l'original). Tot el que no és vàlid queda com a l'original. */
function normalitzarRubrica(r) {
  const out = { criteris: RUBRICA_BASE.map(criteriBase), eliminats: [] };
  if (!r || typeof r !== "object" || !Array.isArray(r.criteris)) return out;
  const text = (v, max, def) => typeof v === "string" ? v.slice(0, max) : def;
  r.criteris.forEach(c => {
    if (!c || typeof c !== "object") return;
    const base = out.criteris.find(x => x.id === c.id && !x.propi);
    if (base) {
      base.nom = text(c.nom, MAX_NOM_CRITERI, base.nom);
      base.que = text(c.que, MAX_QUE_CRITERI, base.que);
      base.pes = pesValid(c.pes) ?? base.pes;
      const b = RUBRICA_BASE.find(x => x.id === c.id);
      if (c.id === "H") {
        base.desc = normalitzarDesc(c.desc || b.desc, b.desc);
        base.biaix = { intro: text(c.biaix && c.biaix.intro, 1500, b.biaix.intro), nivells: normalitzarNivells(c.biaix && c.biaix.nivells, b.biaix.nivells) };
      } else if ("desc" in c) {
        base.desc = normalitzarDesc(c.desc, b.desc || null);
      }
    } else if (typeof c.id === "string" && c.id.length === 1 && LLETRES_PROPIES.includes(c.id)
               && !out.criteris.some(x => x.id === c.id) && out.criteris.length < RUBRICA_BASE.length + LLETRES_PROPIES.length) {
      out.criteris.push({ id: c.id, nom: text(c.nom, MAX_NOM_CRITERI, ""), pes: pesValid(c.pes) ?? 10, que: text(c.que, MAX_QUE_CRITERI, ""), desc: normalitzarDesc(c.desc, null), propi: true });
    }
  });
  if (Array.isArray(r.eliminats)) out.eliminats = out.criteris.map(c => c.id).filter(id => r.eliminats.includes(id));
  // Ordre dels criteris tal com estava al JSON (els que no hi surten, al final)
  const ordre = r.criteris.map(c => c && c.id);
  const pos = id => { const k = ordre.indexOf(id); return k < 0 ? Infinity : k; };
  out.criteris.sort((a, b) => pos(a.id) - pos(b.id));
  // Sempre hi ha d'haver almenys un criteri, i com a màxim MAX_CRITERIS actius
  const actius = out.criteris.filter(c => !out.eliminats.includes(c.id));
  actius.slice(MAX_CRITERIS).forEach(c => out.eliminats.push(c.id));
  return out;
}

let rubricaOriginalJSON = null;
const rubricaOriginal = () => normalitzarRubrica(null);
function rubricaModificada() {
  if (!rubricaOriginalJSON) rubricaOriginalJSON = JSON.stringify(rubricaOriginal());
  return JSON.stringify(estat.rubrica) !== rubricaOriginalJSON;
}
const criterisActius = () => estat.rubrica.criteris.filter(c => !estat.rubrica.eliminats.includes(c.id));
const criteriEliminat = id => estat.rubrica.eliminats.includes(id);
const criteri = id => estat.rubrica.criteris.find(c => c.id === id);
const teCriteri = id => criterisActius().some(c => c.id === id);
const hActiu = () => teCriteri("H");
/* L'H té dues parts (H1 i H2) si el client pot mostrar biaix de gènere */
const ambH1 = () => ambE6() && hActiu();
/* v0.6.4: lletra visible de cada criteri segons la seva posició (A, B, C…). Els ids interns no canvien. */
const LLETRES_VISIBLES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function mapaLletres() {
  const m = {};
  criterisActius().forEach((c, k) => { m[c.id] = LLETRES_VISIBLES[k]; });
  return m;
}
const lletra = id => mapaLletres()[id] || id;
const deLletra = l => "AEFHLMNRSX".includes(l) ? `d'${l}` : `de la ${l}`;
/* «A H, …»; amb la lletra A queda «A A», i es diu «Al criteri A» */
const aLletra = l => l[0] === "A" ? `Al criteri ${l}` : `A ${l}`;
/* Lletres per a les frases del prompt: {A}, {F}, {H}…, {dH} («d'H») i {codiH} */
function lletresPrompt() {
  const m = mapaLletres(), out = {};
  RUBRICA_BASE.forEach(c => { out[c.id] = m[c.id] || c.id; });
  out.dH = deLletra(out.H);
  out.aH = aLletra(out.H);
  out.codiH = ambH1() ? out.H + "2" : out.H;
  return out;
}
const codiH = () => ambH1() ? lletra("H") + "2" : lletra("H");
/* Text d'un criteri de base que s'esmenta a si mateix per la lletra («F sempre és observable»): passa a la lletra visible */
function ambLletraPropia(c, txt) {
  const l = lletra(c.id);
  return c.propi || l === c.id ? txt : txt.replace(new RegExp(`\\b${c.id}\\b(?![0-9])`, "g"), l);
}

/* Criteris trets o afegits, o pesos canviats: la línia REF hi afegeix els codis dels pesos */
function rubricaEstructural() {
  if (!estat.rubrica) return false;
  const pesos = new Map(RUBRICA_BASE.map(c => [c.id, c.pes]));
  return estat.rubrica.eliminats.some(id => pesos.has(id)) || criterisActius().some(c => !pesos.has(c.id) || pesos.get(c.id) !== c.pes);
}

/* Què falta a un criteri perquè el prompt quedi complet (claus per als textos de la interfície) */
function faltesCriteri(c) {
  const f = [];
  if (!textNet(c.nom)) f.push({ k: "nom" });
  if (!textNet(c.que)) f.push({ k: "que" });
  if (c.desc) c.desc.nivells.forEach((n, k) => { if (!textNet(n.d)) f.push({ k: "nivell", n: k }); });
  if (c.biaix) c.biaix.nivells.forEach((n, k) => { if (!textNet(n.d)) f.push({ k: "biaix", n: k }); });
  return f;
}

function errorsRubrica() {
  const act = criterisActius();
  const suma = act.reduce((s, c) => s + c.pes, 0);
  const incomplets = act.filter(c => faltesCriteri(c).length).map(c => lletra(c.id));
  return { buida: !act.length, suma, incomplets, ok: act.length > 0 && suma === 100 && !incomplets.length };
}
/* Text de l'error principal de la rúbrica (per a la pestanya i la fitxa) */
function textErrorRubrica(e) {
  const x = v06();
  return e.buida ? x.rbErrBuida : e.suma !== 100 ? x.rbErrSuma(e.suma) : x.rbErrIncomplet(e.incomplets);
}

/* --- Textos de la rúbrica per al prompt --- */
const numCat = n => String(Math.round(n * 100) / 100).replace(".", ",");
const textTaula = s => textNet(s).replace(/\|/g, "/");
const senseFinal = s => textTaula(s).replace(/[\s.]+$/, "");
const minusculaInicial = s => s ? s[0].toLocaleLowerCase("ca") + s.slice(1) : s;
/* Article davant del nom de la lletra: «l'A», «l'H», «la B», «la I» */
const ambArticle = l => "AEFHLMNRSX".includes(l) ? `l'${l}` : `la ${l}`;

function liniesNivells(nivells, c) {
  const t = v => c ? ambLletraPropia(c, textNet(v)) : textNet(v);
  return [4, 3, 2, 1, 0].map(k => {
    const ex = t(nivells[k].ex);
    return `- **${k}:** ${t(nivells[k].d)}${ex ? ` *Ex.: ${ex}*` : ""}`;
  }).join("\n");
}

function textSostre(s) {
  s = textNet(s).replace(/^sostres?\s*:\s*/i, "");
  if (s && !/[.!?…]$/.test(s)) s += ".";
  return s ? `\n\n${s.includes(";") ? "Sostres" : "Sostre"}: ${s}` : "";
}

function blocDescriptors(c) {
  const L = lletra(c.id), lp = lletresPrompt();
  const nom = senseFinal(c.nom), intro = ambLletraPropia(c, textNet(c.desc.intro));
  const sostre = ambLletraPropia(c, textSostre(c.desc.sostre));
  if (c.id !== "H") return `**${L}. ${nom}.**${intro ? " " + intro : ""}\n\n${liniesNivells(c.desc.nivells, c)}${sostre}`;
  const que = senseFinal(c.que);
  if (ambH1()) {
    return `**${L}. ${nom}.** ${P_H_DUES_PARTS}\n\n- **${L}2. ${que}.**${intro ? " " + intro : ""}\n- **${L}1. ${P_H1_NOM}.** ${omplir(P_H1_QUAN, lp)}\n\n${omplir(P_H_PUNTS, lp)}\n\n*${L}2*\n${liniesNivells(c.desc.nivells, c)}\n\n*${L}1.* ${textNet(c.biaix.intro)}\n${liniesNivells(c.biaix.nivells, c)}${sostre}`;
  }
  const primera = que === senseFinal(RUBRICA_BASE.find(x => x.id === "H").que) ? P_H_OBSERVA : `${que}.`;
  return `**${L}. ${nom}.** ${primera}${intro ? " " + intro : ""}\n\n${liniesNivells(c.desc.nivells, c)}${sostre}`;
}

function filaTaulaRubrica(c) {
  const L = lletra(c.id);
  let que = senseFinal(c.que);
  if (c.id === "H" && ambH1()) que = `${L}2: ${minusculaInicial(que)}. ${omplir(P_H_FILA_H1, lletresPrompt())}`;
  return `| ${L}. ${senseFinal(c.nom)} | ${c.pes}% | ${que}${c.desc ? ". Descriptors a continuació" : ""} |`;
}

/* «1,5 × (A + B) + C + D + …»: els criteris s'agrupen pel seu coeficient (pes / 10) */
function textFormula(act) {
  const grups = [];
  act.forEach(c => {
    const k = c.pes / 10;
    let g = grups.find(x => x.k === k);
    if (!g) grups.push(g = { k, ll: [] });
    g.ll.push(lletra(c.id));
  });
  return grups.map(g => g.k === 1 ? g.ll.join(" + ")
    : `${numCat(g.k)} × ${g.ll.length > 1 ? `(${g.ll.join(" + ")})` : g.ll[0]}`).join(" + ");
}

/* Tots els fragments de les seccions 9.4, 9.5 i 9.6 que depenen de la rúbrica */
function textosRubrica() {
  const act = criterisActius(), h1 = ambH1(), cH = codiH(), lp = lletresPrompt();
  const ambDesc = act.filter(c => c.desc).map(c => lletra(c.id));
  const valors = ["7,5", "5", "2,5"];
  const quins = [hActiu() && cH, teCriteri("I") && lp.I].filter(Boolean);
  const fronteres = P_FRONTERES.filter(f => f.calen.every(teCriteri))
    .map(f => "  - " + omplir(f.text, { ...lp, frontH1: h1 ? omplir(P_H_FRONTERA_H1, lp) : "" }));
  let noObservable = "";
  if (hActiu() && teCriteri("I")) noObservable = `${omplir(P_NO_OBS_H, lp)}, i ${omplir(P_NO_OBS_I, lp)}. `;
  else if (hActiu()) noObservable = `${omplir(P_NO_OBS_H, lp)}. `;
  else if (teCriteri("I")) noObservable = `${omplir(P_NO_OBS_I_SOL, lp)}. `;
  return {
    primerEvidencia: ambDesc.length ? omplir(P_PRIMER_EVIDENCIA, { crit: ambDesc.length === 1 ? `al criteri ${ambDesc[0]}` : `als criteris ${llista(ambDesc, "i")}` }) : "",
    quiTreu: quins.length ? omplir(P_QUI_TREU, { quins: quins.length === 2 ? `${aLletra(quins[0])} i a ${quins[1]}` : aLletra(quins[0]) }) : "",
    mencions: hActiu() || teCriteri("I") ? P_MENCIONS : "",
    fronteres: fronteres.length ? " Fronteres:\n" + fronteres.join("\n") : "",
    filesRubrica: act.map(filaTaulaRubrica).join("\n"),
    formula: textFormula(act),
    notaCalculH: h1 ? omplir(P_H_NOTA_CALCUL, lp) : "",
    descriptors: ambDesc.length
      ? omplir(P_DESCRIPTORS, { dels: ambDesc.length === 1 ? `del criteri ${ambDesc[0]}` : `dels criteris ${llista(ambDesc, "i")}` }) + "\n\n"
        + act.filter(c => c.desc).map(blocDescriptors).join("\n\n") + "\n\n"
      : "",
    noObservable,
    filesResum: act.length > 1 ? `una fila per criteri, de ${ambArticle(lletra(act[0].id))} a ${ambArticle(lletra(act.at(-1).id))}` : act.length ? `una sola fila, per al criteri ${lletra(act[0].id)}` : "una fila per criteri",
    exempleFiles: act.slice(0, 3).map((c, i) => `| ${lletra(c.id)}. ${senseFinal(c.nom)} (${c.pes}%) | ${i === 0 ? "7,5" : "…"} | … |`).join("\n"),
    exempleCalcul: act.slice(0, 3).map((c, i) => c.pes === 10 ? valors[i] : `${numCat(c.pes / 10)} × ${valors[i]}`).join(" + ") + (act.length > 3 ? " + …" : ""),
    formatH: h1 ? omplir(P_H_FORMAT, lp) : ""
  };
}

/* Resum dels criteris per a l'Avaluador de converses (va al JSON) */
function resumCriteris() {
  return criterisActius().map(c => ({ id: c.id, lletra: lletra(c.id), nom: textNet(c.nom), pes: c.pes }));
}


/* ===== v0.6.4: mode de selecció i arrossegament (eixos de personalitat, criteris de la rúbrica i fases) =====
   Els elements que es poden reordenar mostren un agafador (⠿) com a pista, però es poden arrossegar des de
   qualsevol punt: amb el ratolí, prement i movent; al mòbil, mantenint premut uns instants. En mode de
   selecció, cada element té a més una casella; si s'arrossega un element seleccionat, es mouen tots els
   seleccionats junts. Amb el teclat: fletxes amunt i avall sobre l'agafador. */
const ESPERA_ARROSSEGAR = 200;   // ms que cal mantenir premut un element (pantalla tàctil) per començar a arrossegar-lo
const ICONA_AGAFADOR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

/* Nou ordre en moure «grup» (ids) a la posició «abans» (índex entre els que no es mouen) */
function ordreAmbGrup(ids, grup, abans) {
  const resta = ids.filter(id => !grup.includes(id));
  resta.splice(Math.max(0, Math.min(abans, resta.length)), 0, ...ids.filter(id => grup.includes(id)));
  return resta;
}

/* cont: contenidor dels elements; opts: { selector, id(el), actiu(), seleccionats(), enOrdre(ids) } */
function activarArrossegament(cont, opts) {
  if (cont._arrossegament) return;
  cont._arrossegament = true;
  let estatA = null;
  const elements = () => [...cont.querySelectorAll(opts.selector)];
  const linia = document.createElement("div");
  linia.className = "linia-insercio";

  const acabar = () => {
    if (!estatA) return;
    clearTimeout(estatA.temps);
    if (estatA.actiu) {
      elements().forEach(el => el.classList.remove("arrossegant", "en-grup"));
      estatA.el.style.transform = "";
      linia.remove();
      document.body.classList.remove("arrossegant-cos");
    }
    estatA = null;
  };

  const començar = () => {
    const e = estatA;
    e.actiu = true;
    const sel = opts.seleccionats();
    const id = opts.id(e.el);
    e.ids = elements().map(opts.id);
    e.grup = sel.has(id) && sel.size > 1 ? e.ids.filter(x => sel.has(x)) : [id];
    elements().forEach(el => { if (e.grup.includes(opts.id(el))) el.classList.add(el === e.el ? "arrossegant" : "en-grup"); });
    document.body.classList.add("arrossegant-cos");
    try { e.el.setPointerCapture(e.punter); } catch (err) {}
    cont.appendChild(linia);
    moure(e.y);
  };

  // opts.horitzontal: els elements van en fila (fases de l'avaluació); si no, en columna
  const hz = !!opts.horitzontal;
  if (hz) linia.classList.add("vertical");
  const moure = y => {
    const e = estatA;
    e.el.style.transform = hz ? `translateX(${y - e.y0}px)` : `translateY(${y - e.y0}px)`;
    const altres = elements().filter(el => !e.grup.includes(opts.id(el)));
    let abans = altres.length;
    for (let k = 0; k < altres.length; k++) {
      const r = altres[k].getBoundingClientRect();
      if (hz ? y < r.left + r.width / 2 : y < r.top + r.height / 2) { abans = k; break; }
    }
    e.abans = abans;
    const rc = cont.getBoundingClientRect();
    if (hz) {
      const ref = altres[abans] ? altres[abans].getBoundingClientRect().left - 5 : (altres.length ? altres.at(-1).getBoundingClientRect().right + 3 : rc.left);
      linia.style.left = `${ref - rc.left}px`;
    } else {
      const ref = altres[abans] ? altres[abans].getBoundingClientRect().top : (altres.length ? altres.at(-1).getBoundingClientRect().bottom : rc.top);
      linia.style.top = `${ref - rc.top + cont.scrollTop - 1}px`;
    }
  };

  // Elements interactius dins de l'element que no han de començar un arrossegament
  const ignora = opts.ignora || "input, textarea, select, .seg-btn, .gear-btn, .xip";
  cont.addEventListener("pointerdown", ev => {
    if (!opts.actiu() || ev.button !== 0) return;
    const el = ev.target.closest(opts.selector);
    if (!el || !cont.contains(el) || ev.target.closest(ignora)) return;
    const agafador = !!ev.target.closest(".agafador");
    const pos = hz ? ev.clientX : ev.clientY;
    estatA = { el, y0: pos, y: pos, v0: ev.clientY, punter: ev.pointerId, actiu: false, tactil: ev.pointerType === "touch" };
    if (agafador) { ev.preventDefault(); començar(); return; }
    // Ratolí o llapis: comença en moure's (prémer i moure). Tàctil: cal mantenir premut (moure és fer scroll).
    if (estatA.tactil) estatA.temps = setTimeout(() => { if (estatA && !estatA.actiu) començar(); }, ESPERA_ARROSSEGAR);
    else ev.preventDefault();   // que no se seleccioni text en arrossegar
  });
  cont.addEventListener("pointermove", ev => {
    if (!estatA) return;
    const pos = hz ? ev.clientX : ev.clientY;
    estatA.y = pos;
    if (!estatA.actiu) {
      const lluny = Math.abs(pos - estatA.y0) > 5;
      if (estatA.tactil) { if (lluny || (hz && Math.abs(ev.clientY - estatA.v0) > 6)) acabar(); }
      else if (lluny) començar();
      return;
    }
    ev.preventDefault();
    moure(pos);
  });
  const deixar = () => {
    if (!estatA) return;
    if (estatA.actiu) {
      const { ids, grup, abans } = estatA;
      cont._clicBloquejat = true;
      setTimeout(() => { cont._clicBloquejat = false; }, 0);
      acabar();
      const nou = ordreAmbGrup(ids, grup, abans);
      if (nou.join() !== ids.join()) opts.enOrdre(nou);
    } else acabar();
  };
  cont.addEventListener("pointerup", deixar);
  cont.addEventListener("pointercancel", acabar);
  // El clic que arriba en deixar anar un element arrossegat no l'ha de seleccionar
  cont.addEventListener("click", ev => { if (cont._clicBloquejat) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  // Teclat: fletxes sobre l'agafador
  cont.addEventListener("keydown", ev => {
    if (!opts.actiu() || !ev.target.closest(".agafador") || (ev.key !== "ArrowUp" && ev.key !== "ArrowDown")) return;
    ev.preventDefault();
    const el = ev.target.closest(opts.selector), id = opts.id(el), sel = opts.seleccionats();
    const ids = elements().map(opts.id);
    const grup = sel.has(id) && sel.size > 1 ? ids.filter(x => sel.has(x)) : [id];
    const resta = ids.filter(x => !grup.includes(x));
    const primer = ids.indexOf(grup[0]) - ids.slice(0, ids.indexOf(grup[0])).filter(x => grup.includes(x)).length;
    const abans = ev.key === "ArrowUp" ? primer - 1 : primer + 1;
    if (abans < 0 || abans > resta.length) return;
    opts.enOrdre(ordreAmbGrup(ids, grup, abans));
    const nouEl = elements().find(x => opts.id(x) === id);
    const ag = nouEl && nouEl.querySelector(".agafador");
    if (ag) ag.focus();
  });
}

/* ===== v0.6.4: fases del mode d'avaluació ===== */
const FASES_DEFECTE = Object.freeze({ observacio: true, resum: true, punts: true, client: true });
function normalitzarFases(f) {
  const r = { ...FASES_DEFECTE };
  if (f && typeof f === "object") Object.keys(r).forEach(k => { if (typeof f[k] === "boolean") r[k] = f[k]; });
  return r;
}
/* Ordre de les fases (totes es poden reordenar, també la percepció de l'alumne) */
const ORDRE_FASES_DEFECTE = ["observacio", "resum", "punts", "client"];
function normalitzarOrdreFases(o) {
  if (!Array.isArray(o)) return [...ORDRE_FASES_DEFECTE];
  const net = o.filter((id, k) => ORDRE_FASES_DEFECTE.includes(id) && o.indexOf(id) === k);
  if (!net.includes("observacio")) net.unshift("observacio");
  return [...net, ...ORDRE_FASES_DEFECTE.filter(id => !net.includes(id))];
}
const fasesTotes = () => Object.values(estat.fases).every(Boolean) && estat.ordreFases.join() === ORDRE_FASES_DEFECTE.join();

/* Pla de l'avaluació (v0.6.4): els passos, en l'ordre triat pel docent.
   - El primer missatge amb contingut s'envia directament (és el «principal»: aquí s'avalua l'entrevista).
   - La pregunta d'observació (percepció de l'alumne) es pot posar a qualsevol lloc: es fa just abans del
     missatge que la segueix, i aquest missatge s'envia directament (l'alumne ja ha respost).
   - La resta de missatges s'ofereixen amb una pregunta de sí o no (pregunta 1, pregunta 2…).
   Amb l'ordre per defecte, els textos són els de la v0.6.3. */
function plaFases() {
  const f = estat.fases;
  const actives = estat.ordreFases.filter(id => f[id]);
  if (!actives.some(id => id !== "observacio")) return null;
  let k = 0, nPreg = 0, primerFet = false, directe = true;
  const passos = actives.map(id => {
    const p = { id, lletra: "ABCDEFG"[k++] };
    if (id === "observacio") { p.inicial = !primerFet; directe = true; return p; }
    Object.assign(p, FASES_INFORME.find(x => x.id === id), { directe, principal: !primerFet });
    if (!directe) p.n = ++nPreg;
    primerFet = true;
    directe = false;
    return p;
  });
  passos.forEach((p, i) => { p.seg = passos[i + 1] || null; });
  const principal = passos.find(p => p.principal);
  const obsMig = passos.find(p => p.id === "observacio" && !p.inicial) || null;
  return { passos, principal, nPreg, obsInicial: passos[0].id === "observacio" ? passos[0] : null, obsMig, nPreguntes: nPreg + (obsMig ? 1 : 0) };
}

/* Com acaba un missatge segons el que ve després */
function fiPas(p) {
  if (!p.seg) return "acaba amb la frase de tancament i passa a l'estat Tancada";
  return p.seg.id === "observacio" ? "acaba amb la pregunta d'observació" : `acaba amb la pregunta ${p.seg.n}`;
}

/* Secció 9.3 (estats i passos) */
function textEstats(comanda, liniaPerfilAval) {
  const f = estat.fases, pla = plaFases();
  if (!pla) return omplir(P_SENSE_AVALUACIO, { comanda, tancament: P_FRASE_TANCAMENT });
  const { passos, principal, obsInicial, nPreguntes: q } = pla;
  const estats = [
    "**Simulació** (estat inicial). Actues com a client.",
    `**Avaluació en curs.** S'activa quan l'últim missatge de l'usuari conté literalment «${comanda}». **Abans d'això no avaluïs mai.**`
  ];
  if (q) estats.push(`**Informe.** Després ${principal.del}, fas ${["", "una pregunta", "dues preguntes", "tres preguntes"][q]} a l'estudiant per oferir-li més detall.`);
  estats.push(`**Tancada.** ${!q ? `Després ${principal.del}.` : q === 2 ? "Després de la segona pregunta." : q === 1 ? "Després de la pregunta." : "Després de l'última pregunta."} Es pot reobrir amb «${comanda}».`);

  const parts = [
    `La conversa té ${NOMBRES[estats.length]} estats:\n\n${estats.map((e, i) => `${i + 1}. ${e}`).join("\n")}`,
    `En entrar en avaluació: deixes de ser el client, ${liniaPerfilAval}utilitzes l'idioma segons la secció 2, recuperes el perfil assignat i analitzes només la interacció real.`
  ];
  passos.forEach(p => {
    if (p.id === "observacio") {
      if (p.inicial) parts.push(omplir(P_OBSERVACIO, { A: p.lletra, B: p.seg.lletra, comanda }));
      else parts.push(`**Pas ${p.lletra} — Observació de l'estudiant.** El missatge següent de l'estudiant és la resposta a la pregunta d'observació. Si no és una observació sobre el client, considera que no n'hi ha. No repeteixis la pregunta. ${p.seg ? `Passa al pas ${p.seg.lletra}.` : "Respon amb la frase de tancament i passa a l'estat Tancada."}`);
    } else if (p.principal) {
      parts.push(`**Pas ${p.lletra} — ${p.titol}.** ${p.pas}, ${fiPas(p)}${p.seg ? " i passa a l'estat Informe" : ""}.`);
    } else if (p.directe) {
      parts.push(`**Pas ${p.lletra} — ${p.titol}.** Escriu ${p.el} de la secció 9.6, tenint en compte l'observació de l'estudiant, i ${fiPas(p)}.`);
    } else {
      parts.push(`**Pas ${p.lletra} — Pregunta ${p.n}.** El missatge següent de l'estudiant és la resposta a la pregunta ${p.n}. Si és afirmativa, escriu ${p.el}. Tant si ho és com si no, ${fiPas(p)}.`);
    }
  });
  const despres = passos.slice(passos.indexOf(principal) + 1);
  if (despres.length) parts.push(`${despres.length === 1 ? `En el pas ${despres[0].lletra}` : `En els passos ${llista(despres.map(p => p.lletra), "i")}`}, no tornis a la simulació${f.resum ? " ni modifiquis cap nota" : ""}.`);
  const reobrir = despres.length
    ? `aleshores torna a fer ${despres[0].id === "observacio" ? "la pregunta d'observació" : `la pregunta ${despres[0].n}`} i continua des del pas ${despres[0].lletra}.`
    : `aleshores torna a donar ${principal.el} que ja has escrit, sense canviar-lo.`;
  const resumPrimer = principal.id === "resum";
  parts.push(`**Estat Tancada.** A qualsevol missatge de l'usuari respon únicament la frase de tancament: ${P_FRASE_TANCAMENT} L'única excepció és un missatge que contingui «${comanda}»: ${reobrir} ${obsInicial ? `No repeteixis el pas ${obsInicial.lletra} ni tornis a avaluar` : "No tornis a avaluar"}${!f.resum ? "." : resumPrimer ? "; les notes són les del resum que ja has donat." : "; si ja has donat les notes, no les canviïs."}`);
  return parts.join("\n\n");
}

/* Secció 9.6 (estructura de l'informe). «valors»: els textos de la rúbrica i la línia REF per al resum. */
function textInforme(valors) {
  const f = estat.fases, pla = plaFases();
  if (!pla) return P_SENSE_INFORME;
  const { passos, principal, obsMig } = pla;
  const continguts = passos.filter(p => p.id !== "observacio");
  const directes = continguts.filter(p => p.directe), opc = continguts.filter(p => !p.directe), n = opc.length;
  const resumPrimer = principal.id === "resum";
  let intro;
  if (n === 2 && resumPrimer && directes.length === 1) {
    intro = "L'informe es lliura en tres missatges: el resum, que sempre s'escriu, i dos apartats opcionals que l'estudiant tria responent a dues preguntes. Els apartats desenvolupen l'avaluació que ja has fet: han de ser coherents amb les puntuacions del resum. No tornis a avaluar ni canviïs cap nota. Escriu les preguntes en l'idioma de l'avaluació.";
  } else if (continguts.length === 1) {
    intro = `L'informe es lliura en un sol missatge: ${principal.el}.`;
  } else {
    const total = ["", "un", "dos", "tres"][continguts.length];
    const sempre = `${llista(directes.map(p => p.el), "i")}, que sempre s'${directes.length > 1 ? "escriuen" : "escriu"}`;
    const opcional = n ? `, i ${n === 1 ? "un missatge opcional que l'estudiant tria responent a una pregunta" : "dos missatges opcionals que l'estudiant tria responent a dues preguntes"}` : "";
    const coherencia = !f.resum ? "Tots els missatges han de ser coherents entre ells."
      : resumPrimer ? "Els missatges següents desenvolupen l'avaluació que ja has fet: han de ser coherents amb les puntuacions del resum. No tornis a avaluar ni canviïs cap nota."
      : "Avalua tota l'entrevista en preparar el primer missatge i mantén aquesta valoració en els següents: les notes del resum han de ser coherents amb el que ja hagis dit.";
    intro = `L'informe es lliura en ${total} missatges: ${sempre}${opcional}. ${coherencia} Escriu les preguntes en l'idioma de l'avaluació.`;
  }
  if (!f.resum) intro += " No donis cap puntuació ni cap nota.";

  const seccions = continguts.map(p => {
    const cap = p.capcalera + (p.directe ? "" : ` (si respon que sí a la pregunta ${p.n})`);
    let fi;
    if (!p.seg) fi = "Acaba amb la frase de tancament.";
    else if (p.seg.id === "observacio") fi = `Acaba amb la pregunta d'observació: ${P_PREGUNTA_OBSERVACIO}`;
    else fi = `Acaba amb la pregunta ${p.seg.n}: ${p.seg.pregunta}`;
    return `${cap}\n\n${p.id === "resum" ? omplir(p.cos, valors) : p.cos}\n\n${fi}`;
  });
  return [intro, ...seccions].join("\n\n");
}

function obrirRubrica(id) {

    b.querySelector(".rb-pes").textContent = `${c.pes}%`;
    b.prepend(controlsSeleccio(textNet(c.nom) || lletra(c.id), selCrit.ids.has(c.id), v => {

    if (sel) {

/* Camp del detall: etiqueta + input/textarea. Desa a cada tecla sense redibuixar (no es perd el focus). */
function campRubrica(pare, etiqueta, valor, opts, enCanvi) {
  const id = `rb_${opts.id}`;
  const wrap = document.createElement("div");
  wrap.className = "rb-camp" + (opts.classe ? " " + opts.classe : "");
  const l = document.createElement("label");
  l.className = "ed-label";
  l.htmlFor = id;
  l.textContent = etiqueta;
  const el = document.createElement(opts.multi ? "textarea" : "input");
  if (!opts.multi) el.type = opts.tipus || "text";
  el.id = id;
  el.value = valor;
  if (opts.max) el.maxLength = opts.max;
  if (opts.ph) el.placeholder = opts.ph;
  if (opts.multi) el.rows = Math.min(8, Math.max(opts.rows || 2, Math.ceil(String(valor).length / 80) + 1));
  el.addEventListener("input", () => enCanvi(el.value, el));
  if (opts.tipus === "number") {
    el.min = 1; el.max = 100; el.step = 1; el.inputMode = "numeric";
    el.addEventListener("blur", () => { el.value = criteri(rbSel).pes; });
  }
  wrap.append(l, el);
  if (opts.sufix) {
    const s = document.createElement("span");
    s.className = "rb-sufix";
    s.textContent = opts.sufix;
    wrap.appendChild(s);
  }
  pare.appendChild(wrap);
  return el;
}

/* Qualsevol canvi d'un camp: llista, barra, bloc de la pestanya, protecció, fitxa i prompt */
function canviRubrica() {
  renderRubricaSide();
  const f = $("rbFaltes"), c = criteri(rbSel);
  if (f && c) f.textContent = textFaltesCriteri(c);
  renderRubricaBloc();
  refrescarVistes();
}

function afegirCriteri() {
  if (criterisActius().length >= MAX_CRITERIS) return;
  const lletra = [...LLETRES_PROPIES].find(l => !criteri(l));
  if (!lletra) return;
  estat.rubrica.criteris.push({ id: lletra, nom: "", pes: 10, que: "", desc: null, propi: true });
  rbSel = lletra;
  canviRubrica();
  renderRubricaDetall();
  const nom = $("rb_nom");
  if (nom) nom.focus();
}

function eliminarCriteri(id) {
  const act = criterisActius();
  if (criteriEliminat(id)) return;
  const k = act.findIndex(c => c.id === id);
  estat.rubrica.eliminats.push(id);
  const resta = criterisActius();
  rbSel = resta.length ? resta[Math.min(k, resta.length - 1)].id : null;
  canviRubrica();
  renderRubricaDetall();
}

function recuperarCriteri(id) {
  if (criterisActius().length >= MAX_CRITERIS) return;
  estat.rubrica.eliminats = estat.rubrica.eliminats.filter(x => x !== id);
  // Torna al seu lloc: els criteris es mostren en l'ordre de la llista (els de base, A–I, primer)
  rbSel = id;
  canviRubrica();
  renderRubricaDetall();
}

function esborrarCriteri(id) {
  const c = criteri(id);
  if (!c || !c.propi) return;
  estat.rubrica.criteris = estat.rubrica.criteris.filter(x => x.id !== id);
  estat.rubrica.eliminats = estat.rubrica.eliminats.filter(x => x !== id);
  descAmagades.delete(id);
  canviRubrica();
}

function restaurarRubrica(btn) {
  if (!rubricaModificada()) return;
  if (btn) { confirmarAmbDobleClic(btn, v06().rbConfirmRestaurar, () => restaurarRubrica()); return; }
  estat.rubrica = rubricaOriginal();
  descAmagades.clear();
  if (!criteri(rbSel) || criteriEliminat(rbSel)) rbSel = "A";
  canviRubrica();
  renderRubricaDetall();
}

/* ===== v0.6.3: protecció de les notes (línia oculta REF) =====
   Clau: { id, ordre, codis, prov }
     id     → codi que obre la línia i diu a l'Avaluador quina clau ha de fer servir
     ordre  → ordre (barrejat) de les files de la taula; «H» és H (o H2 si l'E6 és actiu) i «H1» només surt amb l'E6
     codis  → per a cada fila, 6 codis: nivells 0, 1, 2, 3, 4 i N/O
     prov   → codis de l'avaluació provisional (no / sí)
   La clau bàsica és comuna a tots els clients i l'Avaluador en té una còpia idèntica: si es canvia aquí, cal canviar-la allà.
   La clau avançada se sorteja per a cada client i només viu dins del seu JSON. */
const CLAU_BASICA = {"id": "N6E", "ordre": ["D", "H1", "G", "A", "F", "C", "H", "I", "B", "E"], "codis": {"A": ["82G", "94A", "Q6J", "MQU", "P24", "7XU"], "B": ["XF7", "GKE", "XKD", "PMG", "XQ8", "CAK"], "C": ["CWJ", "FPR", "RM6", "X33", "F48", "GE4"], "D": ["8PK", "2RH", "2N3", "2YA", "AHR", "CM6"], "E": ["MAT", "2YQ", "CCG", "V29", "HMM", "MX4"], "F": ["NC4", "KWF", "RJY", "YXA", "8Y6", "HQG"], "G": ["DM4", "279", "MAR", "8JQ", "9GN", "9XH"], "H": ["HYE", "EH9", "6C3", "N7G", "PFJ", "WXF"], "H1": ["FNY", "YGG", "3J4", "HWN", "9YX", "X2Q"], "I": ["8EK", "DHR", "DDX", "UA7", "DTQ", "YVT"]}, "prov": {"no": "GVX", "si": "GYT"}};
const FILES_REF = ["A", "B", "C", "D", "E", "F", "G", "H", "H1", "I"];
const ALFABET_REF = "ACDEFGHJKMNPQRTUVWXY2346789";   // sense caràcters que es confonen (0/O, 1/I/L, 5/S, 8/B, Z)
const RE_CODI_REF = /^[ACDEFGHJKMNPQRTUVWXY2346789]{3}$/;

/* v0.6.4: la protecció avançada desapareix. Tots els clients fan servir la clau bàsica.
   Els criteris propis (lletres J a Z) tenen codis fixos, comuns a tots els clients; l'Avaluador n'ha de tenir una còpia idèntica.
   Cada codi és únic: l'Avaluador sap de quin criteri i de quin nivell és només amb el codi. */
const CODIS_REF_PROPIS = {"J": ["MVF", "KNJ", "8KX", "3GA", "UC9", "W34"], "K": ["3WN", "6WD", "A87", "WX3", "4J2", "GFC"], "L": ["HR3", "UCT", "3U2", "H9K", "WYE", "V3Y"], "M": ["VDT", "UPP", "RET", "6GY", "KF8", "W7C"], "N": ["HHJ", "VC6", "2FH", "K64", "9HU", "KVC"], "O": ["GNN", "7KF", "DM7", "U48", "JM8", "XM7"], "P": ["CWR", "RFK", "JCF", "MNY", "4QA", "9K9"], "Q": ["U89", "ADV", "7KQ", "M84", "PH7", "NR8"], "R": ["3K2", "X9W", "RKH", "7ED", "7QU", "V9H"], "S": ["U98", "UF2", "989", "RKW", "DC4", "7VU"], "T": ["A7A", "33R", "TA4", "MCM", "3XY", "HWE"], "U": ["K8R", "FNG", "MVD", "YMK", "WNU", "JCV"], "V": ["69Q", "KR8", "KJF", "2JX", "T28", "647"], "W": ["DCQ", "JU6", "CGU", "94F", "VV2", "JY9"], "X": ["WMU", "9P4", "2N7", "F63", "3XT", "V38"], "Y": ["JDY", "43F", "3KV", "THE", "CGM", "P3Q"], "Z": ["6UT", "7K6", "EXT", "WFY", "FH8", "F86"]};
const codisRef = f => CLAU_BASICA.codis[f] || CODIS_REF_PROPIS[f];
const ORDRE_REF = [...CLAU_BASICA.ordre, ...Object.keys(CODIS_REF_PROPIS)];

/* Amb pesos o criteris propis, la línia REF acaba amb un codi de pes per a cada criteri (en l'ordre de les files),
   perquè l'Avaluador pugui calcular la nota només amb la conversa.
   Posició p (0, 1, 2…) i pes w: n = (w + 37 × (p + 1)) mod 729; codi = A[n div 27] + A[n mod 27] + A[(i1 + i2 + p) mod 27],
   on A és ALFABET_REF i i1, i2 són les posicions dels dos primers caràcters a A. */
function codiPes(w, p) {
  const n = (w + 37 * (p + 1)) % 729, i1 = Math.floor(n / 27), i2 = n % 27;
  return ALFABET_REF[i1] + ALFABET_REF[i2] + ALFABET_REF[(i1 + i2 + p) % 27];
}

/* Text de la secció REF del prompt, amb la taula de codis */
function textRef() {
  const e6 = ambH1();
  const actius = criterisActius().map(c => c.id);
  const files = ORDRE_REF.filter(f => f === "H1" ? e6 : actius.includes(f));
  const etiqueta = f => f === "H1" ? lletra("H") + "1" : f === "H" && e6 ? lletra("H") + "2" : lletra(f);
  const taula = [
    "| Fila | Criteri | Nivell 0 | Nivell 1 | Nivell 2 | Nivell 3 | Nivell 4 | N/O |",
    "|---|---|---|---|---|---|---|---|",
    ...files.map((f, i) => `| ${i + 1} | ${etiqueta(f)} | ${codisRef(f).join(" | ")} |`)
  ].join("\n");
  const prov = omplir(P_REF_PROV, { no: CLAU_BASICA.prov.no, si: CLAU_BASICA.prov.si });
  const pesos = rubricaEstructural() ? files.filter(f => f !== "H1").map((f, p) => codiPes(criteri(f).pes, p)) : [];
  return omplir(P_REF, {
    id: CLAU_BASICA.id,
    notaH: e6 ? omplir(P_REF_NOTA_H, lletresPrompt()) : "",
    acaba: pesos.length ? omplir(P_REF_AMB_PESOS, { prov, pesos: pesos.join("-") }) : `3. Acaba amb ${prov}.`,
    nSepara: pesos.length ? 5 : 4,
    taula
  });
}


/* ===== Codi per activar l'avaluació ===== */
/* Retorna el problema del codi (clau de text) o null si és vàlid */
function problemaCodi(codi) {
  if (!codi) return "buit";
  if (codi.length < CODI_LIMITS.min) return "curt";
  if (codi.length > CODI_LIMITS.max) return "llarg";
  if (/[«»\n]/.test(codi)) return "caracters";
  if (CODI_PROHIBITS.includes(codi.toLowerCase())) return "comu";
  return null;
}

/* v0.6.4: el codi propi depèn del seu interruptor («Personalitzat»), no del mode avançat */
function codiAvaluacio() {
  const c = (estat.codiAval || "").trim();
  return estat.codiPropi && !problemaCodi(c) ? c : COMANDA_AVALUACIO;
}

function renderCodi() {
  const x = v06(), c = (estat.codiAval || "").trim();
  const nota = $("evalCodeNote");
  $("evalCodeSwitch").checked = estat.codiPropi;
  $("evalCode").disabled = !estat.codiPropi;
  if (!estat.codiPropi) {
    $("evalCode").value = COMANDA_AVALUACIO;
    nota.classList.remove("avis");
    nota.textContent = x.codiNota(COMANDA_AVALUACIO);
    return;
  }
  if (document.activeElement !== $("evalCode")) $("evalCode").value = estat.codiAval;
  const p = problemaCodi(c);
  nota.classList.toggle("avis", !!p || !/\d/.test(c));
  nota.textContent = p ? x.codiProblemes[p](COMANDA_AVALUACIO)
    : (!/\d/.test(c) ? x.codiSenseNumero : x.codiNota(c));
}

function canviCodi() {
  estat.codiAval = $("evalCode").value;
  renderCodi();
  refrescarVistes();
}

function canviCodiPropi() {
  estat.codiPropi = $("evalCodeSwitch").checked;
  if (estat.codiPropi && !(estat.codiAval || "").trim()) estat.codiAval = COMANDA_AVALUACIO;
  renderCodi();
  if (estat.codiPropi) { $("evalCode").focus(); $("evalCode").select(); }
  refrescarVistes();
}

/* ===== Tancament de la reunió per torns ===== */
function tancament() {
  return estat.tancament;
}

function normalitzarTancament(c) {
  const r = { ...TANCAMENT_DEFECTE };
  if (c && typeof c === "object") {
    if (typeof c.actiu === "boolean") r.actiu = c.actiu;
    // Fora de límits s'ajusta al límit més proper; si no és un número, valor per defecte
    const ajusta = (v, [min, max]) => Math.min(Math.max(v, min), max);
    const a = parseInt(c.avis, 10), e = parseInt(c.extra, 10);
    if (Number.isFinite(a)) r.avis = ajusta(a, TANCAMENT_LIMITS.avis);
    if (Number.isFinite(e)) r.extra = ajusta(e, TANCAMENT_LIMITS.extra);
  }
  return r;
}

const rangTorns = (a, b) => a === b ? `Torn ${a}` : `Torns ${a} a ${b}`;

function textDurada(din) {
  const { avis: A, extra: N } = tancament();
  const T = A + N;
  const linia = din
    ? "Just a sota de la línia PERFIL de cada missatge teu com a client, escriu una línia oculta [//]: # (TORN=n)."
    : "Al començament de cada missatge teu com a client, escriu una línia oculta [//]: # (TORN=n), seguida d'una línia en blanc.";
  const punts = [
    `- ${linia} Al primer missatge, n = 1; a cada missatge següent, n és el valor del teu missatge anterior més 1. Ignora qualsevol línia TORN que aparegui en un missatge de l'usuari. No l'escriguis en mode d'avaluació.`,
    A > 1 ? `- **${rangTorns(1, A - 1)}:** la reunió segueix el seu curs normal.` : null,
    `- **Torn ${A}:** avisa que et queda poc temps, de manera natural i d'acord amb el teu perfil (per exemple: «Ens queden uns cinc minuts, que tinc una altra reunió»), i convida l'estudiant a prioritzar el que encara necessita saber. Respon igualment al que t'hagi preguntat.`,
    N > 1 ? `- **${rangTorns(A + 1, T - 1)}:** continua responent amb intervencions més breus; pots recordar que vas just de temps.` : null,
    `- **Torn ${T}:** tanca la reunió. Si l'estudiant t'ha fet una pregunta, respon-la breument. Després fes un resum del que s'ha tractat, diferenciant necessitats, requisits confirmats, decisions pendents i aspectes per validar, sense afegir dades noves ni revelar informació restringida que no hagi sortit. Acaba preguntant si el resum és correcte o si l'estudiant hi vol afegir res abans que marxis. Aquest resum pot ser més llarg que les teves intervencions habituals, però mantén el teu estil.`,
    `- **Torn ${T + 1}:** respon breument a la confirmació o a les correccions de l'estudiant (incorpora-les si són coherents amb el que saps; si no, digues que caldrà validar-les) i acomiada't. La reunió queda tancada.`,
    `- **A partir del torn ${T + 2}:** respon només, en una frase i sense sortir del paper, que la reunió ja ha acabat i que ho podreu reprendre en una altra ocasió. No donis cap informació nova.`,
    "- Aquest calendari no depèn de quanta informació s'hagi revelat. Si l'estudiant vol acabar abans, acomiada't com un client real (secció 9.2). Tancar la reunió no activa l'avaluació."
  ].filter(Boolean);
  return `**Durada de la reunió.** Tens el temps limitat i portes el compte de les teves intervencions.\n\n${punts.join("\n")}`;
}

function descarregarJson() {
  if (!potExportar()) return;
  feinaExportada();
  const dades = generarEstructuraJSON();
  const blob = new Blob([JSON.stringify(dades, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${dades.name}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function feedbackBoto(btn, text, ok, original) {
  btn.textContent = text;
  btn.style.borderColor = ok ? "var(--success)" : "var(--error)";
  btn.style.color = ok ? "var(--success)" : "var(--error)";
  setTimeout(() => {
    btn.textContent = original();
    btn.style.borderColor = "";
    btn.style.color = "";
  }, 2200);
}

function copiarPrompt() {
  if (!potExportar()) return;
  feinaExportada();
  const text = compilarSystemPrompt();
  const btn = $("ui_btn_copy");
  const exit = () => feedbackBoto(btn, t().copied, true, () => t().btnCopy);
  const error = () => feedbackBoto(btn, t().copyError, false, () => t().btnCopy);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(exit).catch(() => copiaAlternativa(text, exit, error));
  } else {
    copiaAlternativa(text, exit, error);
  }
}

function copiaAlternativa(text, exit, error) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? exit() : error();
  } catch (e) {
    error();
  }
}

/* ===== Importació ===== */
function aplicarIdiomes(llista) {
  $("lang_cat").checked = llista.includes("cat");
  $("lang_es").checked = llista.includes("es");
  $("lang_en").checked = llista.includes("en");
  actualitzarNotaLlengua();
}

/* Busca a quin tret i opció correspon un text de prompt */
function trobarOpcioPerText(text) {
  for (const a of ATRIBUTS) {
    const o = a.opcions.find(op => text.includes(op.prompt));
    if (o) return { attrId: a.id, optId: o.id };
  }
  return null;
}

function seccio(sp, capcalera) {
  const i = sp.indexOf(capcalera);
  if (i === -1) return null;
  const inici = i + capcalera.length;
  const fi = sp.indexOf("\n=== ", inici);
  return sp.slice(inici, fi === -1 ? sp.length : fi).trim();
}

function importarDesDeConfig(c) {
  // v0.6.4: primer els trets propis, perquè la selecció dels nivells els pugui fer servir
  estat.propis = normalitzarPropis(c.tretsPropis);
  estat.eliminats = Array.isArray(c.tretsEliminats) ? totsElsTrets().map(a => a.id).filter(id => c.tretsEliminats.includes(id)) : [];
  estat.ordre = Array.isArray(c.ordreTrets) ? c.ordreTrets.filter((id, k) => tret(id) && c.ordreTrets.indexOf(id) === k) : [];
  estat.rubrica = normalitzarRubrica(c.rubrica);
  if (c.assistantName) $("assistantName").value = c.assistantName;
  if (c.charName) $("charName").value = c.charName;
  if (c.charRole) $("charRole").value = c.charRole;
  $("companyName").value = typeof c.empresa === "string" ? c.empresa : "";
  if (Array.isArray(c.agentLangs)) aplicarIdiomes(c.agentLangs);
  else if (c.agentLang) aplicarIdiomes([c.agentLang]);
  if (c.forceLanguages !== undefined) $("forceLanguages").checked = !!c.forceLanguages;
  if (c.infoOberta !== undefined) $("infoOberta").value = c.infoOberta;
  if (c.infoOculta !== undefined) $("infoOculta").value = c.infoOculta;

  // Trets de versions anteriors amb ids diferents s'ignoren (queden els valors per defecte)
  estat.sel = normalitzarSel(c.trets);
  estat.tancament = normalitzarTancament(c.tancament);   // configs anteriors a la v0.5.7: valors per defecte
  estat.codiAval = typeof c.codiAvaluacio === "string" ? c.codiAvaluacio.slice(0, CODI_LIMITS.max) : COMANDA_AVALUACIO;
  // v0.6.4: el codi propi i la protecció avançada ja no depenen del mode avançat.
  // Fins a la v0.6.3, només s'aplicaven amb el mode avançat activat: es manté el prompt que tenia el client.
  const v064 = typeof c.codiPropi === "boolean";
  estat.codiPropi = v064 ? c.codiPropi : !!c.advancedMode && estat.codiAval.trim() !== COMANDA_AVALUACIO;
  // v0.6.4: la clau avançada de versions anteriors s'ignora (ara tots els clients fan servir la bàsica)
  const av = c.avaluacio && typeof c.avaluacio === "object" ? c.avaluacio : {};
  estat.fases = normalitzarFases(av.fases);
  estat.ordreFases = normalitzarOrdreFases(av.ordreFases);
  $("freeTrait").value = typeof c.tretLliure === "string" ? c.tretLliure.slice(0, TRET_LLIURE.maxCaracters) : "";
  $("dynamicProfile").checked = !!c.dynamicProfile;

  if (c.dinTrets) {
    // v0.5.3 o posterior
    estat.dinSel = normalitzarDin(c.dinTrets);
    $("randomIdentity").checked = typeof c.clientDinamic === "boolean"
      ? c.clientDinamic
      : !!c.dynamicProfile && c.randomIdentity !== false;
    if (Array.isArray(c.arees)) estat.arees = AREES.filter(a => c.arees.includes(a.id)).map(a => a.id);
    estat.perso = normalitzarPerso(c.personalitzacio);
    $("advancedMode").checked = !!c.advancedMode;
  } else if (c.advancedMode) {
    // Fins a la v0.5.2, el mode avançat afegia l'E6 (en dinàmic, sortejat)
    estat.dinSel.genere = ALEATORI;
  } else {
    estat.sel.genere = "neutral";
  }
}

/* Prompt v0.4+ (estructura del prompt de referència, seccions «## 1.» a «## 9.») */
function importarDesDePromptV4(sp) {
  const mOrg = sp.match(/Ets un representant fictici de «(.+?)»\./);
  $("companyName").value = mOrg ? mOrg[1].trim() : "";

  const dinamic = sp.includes("### 7.1 Obtenció i persistència");
  $("dynamicProfile").checked = dinamic;

  const mId = sp.match(/^- Nom: (.+)\n- Càrrec: (.+)$/m);
  if (mId) {
    $("charName").value = mId[1].trim();
    $("charRole").value = mId[2].trim();
  }

  const oberta = sp.match(/<informacio_oberta>\n?([\s\S]*?)\n?<\/informacio_oberta>/);
  if (oberta) $("infoOberta").value = oberta[1].trim();
  const restringida = sp.match(/<informacio_restringida>\n?([\s\S]*?)\n?<\/informacio_restringida>/);
  if (restringida) $("infoOculta").value = restringida[1].trim();

  const noms = { "català": "cat", "castellà": "es", "anglès": "en" };
  const mInici = sp.match(/^- Idioma inicial: (.+)$/m);
  const mPermesos = sp.match(/^- Idiomes permesos: (.+)$/m);
  $("forceLanguages").checked = !!mPermesos;
  const font = (mPermesos ? mPermesos[1] : (mInici ? mInici[1] : "català")).toLowerCase();
  aplicarIdiomes(Object.keys(noms).filter(n => font.includes(n)).map(n => noms[n]));

  // Eixos amb nivell fix (en dinàmic, la resta dels que surten al prompt són aleatoris)
  estat.sel = selPerDefecte();
  const desti = dinamic ? estat.dinSel : estat.sel;
  if (dinamic) {
    [...sp.matchAll(/^#### (E\d+) — /gm)].forEach(m => {
      const a = ATRIBUTS.find(x => x.eix === m[1]);
      if (a) estat.dinSel[a.id] = ALEATORI;
    });
  }
  [...sp.matchAll(/^#### (E\d+) — [^\n]*\n\n(?:Nivell assignat|Nivell fix \(no se sorteja\)): \*\*(\d+)\./gm)].forEach(m => {
    const a = ATRIBUTS.find(x => x.eix === m[1]);
    const o = a && a.opcions[Number(m[2]) - 1];
    if (o) desti[a.id] = o.id;
  });

  // Identitat aleatòria i àrees permeses
  $("randomIdentity").checked = !mId;
  const arees = AREES.filter(a => sp.includes(`*${a.prompt}:*`)).map(a => a.id);
  if (arees.length) estat.arees = arees;

  // Codi d'avaluació: si el prompt en porta un de propi, s'activa «Personalitzat»
  const mCodi = sp.match(/conté literalment «([^»\n]+)»/);
  estat.codiAval = mCodi ? mCodi[1] : COMANDA_AVALUACIO;
  estat.codiPropi = estat.codiAval !== COMANDA_AVALUACIO;


  // Tancament per torns: es recupera del prompt; si no en porta, queda desactivat
  const mAvis = sp.match(/^- \*\*Torn (\d+):\*\* avisa que et queda poc temps/m);
  const mTanca = sp.match(/^- \*\*Torn (\d+):\*\* tanca la reunió/m);
  estat.tancament = mAvis && mTanca
    ? normalitzarTancament({ actiu: true, avis: mAvis[1], extra: Number(mTanca[1]) - Number(mAvis[1]) })
    : { ...TANCAMENT_DEFECTE, actiu: false };

  const mLliure = sp.match(/^\*\*Tret addicional\*\* \(sempre actiu, sigui quin sigui el perfil\): (.+)$/m);
  $("freeTrait").value = mLliure ? mLliure[1].trim() : "";
}

function importarDesDePrompt(data) {
  if (data.name) $("assistantName").value = data.name;
  const sp = data.system_prompt || "";
  if (sp.includes("## 1. FUNCIÓ I OBJECTIU PEDAGÒGIC")) { importarDesDePromptV4(sp); return; }

  const mRol31 = sp.match(/^Ets (.+?)\. El teu càrrec és (.+?) a (?:l'organització «(.+?)»|l'empresa)\./m);
  const mRol30 = sp.match(/^Ets\s+([^,\n]+),\s+(.+?)\s+de l'empresa\./m);
  $("companyName").value = "";
  if (mRol31) {
    $("charName").value = mRol31[1].trim();
    $("charRole").value = mRol31[2].trim();
    if (mRol31[3]) $("companyName").value = mRol31[3].trim();
  } else if (mRol30) {
    $("charName").value = mRol30[1].trim();
    $("charRole").value = mRol30[2].trim();
  } else if (data.description) {
    const m = data.description.match(/(?:Client|Stakeholder) simulat:\s*([^(·]+)/i);
    if (m) $("charName").value = m[1].trim();
  }

  const context = seccio(sp, "=== EL CAS ===")?.replace(/^Això ho saps i ho pots explicar[^\n]*\n/, "") ?? seccio(sp, "=== CONTEXT DE L'EMPRESA ===") ?? (sp.match(/CONTEXT GENERAL DE L'EMPRESA:\s*\n([\s\S]*?)\n\s*(?:PERFIL|INFORMACIÓ RESERVADA)/) || [])[1];
  if (context) $("infoOberta").value = context.trim();

  let reservada = seccio(sp, "=== INFORMACIÓ RESERVADA ===");
  if (reservada) reservada = reservada.replace(/^(?:Aquesta informació només la reveles|Això també ho saps)[^\n]*\n/, "");
  else reservada = (sp.match(/INFORMACIÓ RESERVADA I CUSTODIADA:\s*\n([\s\S]*?)\n\s*DIRECTRIUS DE COMPORTAMENT/) || [])[1];
  if (reservada) $("infoOculta").value = reservada.trim();

  const idioma = (seccio(sp, "=== IDIOMA ===") || sp).toLowerCase();
  $("forceLanguages").checked = idioma.includes("només parles") || idioma.includes("gestió estricta") || idioma.includes("gestió lingüística estricta");
  aplicarIdiomes(["cat", "es", "en"].filter((id, i) => idioma.includes(["català", "castellà", "anglès"][i])));

  estat.sel = selPerDefecte();
  let avancat = false;
  let lliure = "";

  const dinamic = sp.includes("=== EL TEU PERFIL (ES DEFINEIX AL PRIMER MISSATGE) ===");
  $("dynamicProfile").checked = dinamic;

  if (dinamic) {
    const blocs = sp.split(/^EIX \d+ — .+$/m).slice(1);
    // Només cal saber quins trets hi surten (per detectar el mode avançat); la numeració és fixa
    blocs.forEach(bloc => {
      const m = bloc.match(/^\d+ = (.+)$/m);
      const r = m && trobarOpcioPerText(m[1]);
      if (r && tret(r.attrId).avancat) avancat = true;
    });
    const mLliure = sp.match(/TRET ADDICIONAL \(sempre actiu[^\n]*\n(.+)/);
    if (mLliure) lliure = mLliure[1].trim();
  } else {
    const perfil = seccio(sp, "=== EL TEU PERFIL ===") || "";
    [...perfil.matchAll(/^- (.+?): (.+)$/gm)].forEach(m => {
      if (m[1] === "Tret addicional") { lliure = m[2].trim(); return; }
      const r = trobarOpcioPerText(m[2]);
      if (r) {
        estat.sel[r.attrId] = r.optId;
        if (tret(r.attrId).avancat) avancat = true;
      }
    });
  }

  $("freeTrait").value = lliure;
  // En les versions antigues, l'E6 només hi era amb el mode avançat
  if (dinamic && avancat) estat.dinSel.genere = ALEATORI;
}

/* Carrega un client (JSON del generador) a l'editor. La fan servir la importació i la recuperació de l'esborrany. */
function carregarDadesClient(data) {
  if (!data || (!data._config && !data.system_prompt)) throw new Error("Estructura no reconeguda");
  // Valors per defecte de les opcions noves; la importació els sobreescriu si en té
  estat.propis = [];                     // v0.6.4
  estat.eliminats = [];
  estat.ordre = [];
  estat.rubrica = rubricaOriginal();
  estat.codiPropi = false;
  estat.dinSel = dinPerDefecte();
  estat.arees = totesLesArees();
  estat.perso = {};
  estat.fases = { ...FASES_DEFECTE };
  estat.ordreFases = [...ORDRE_FASES_DEFECTE];
  $("randomIdentity").checked = false;   // v0.6.2: abans quedava activat si el JSON no deia res
  $("advancedMode").checked = false;
  if (data._config) importarDesDeConfig(data._config);
  else importarDesDePrompt(data);
  renderitzar();
}

function importarJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = $("ui_btn_import");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      carregarDadesClient(data);
      feedbackBoto(btn, t().imported, true, () => t().btnImport);
    } catch (err) {
      console.error("Error en importar JSON:", err);
      feedbackBoto(btn, t().importError, false, () => t().btnImport);
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsText(file);
}

/* v0.6.3: la fitxa es mostra sencera, sense barra pròpia. Si cap a la finestra, queda enganxada a dalt;
   si és més alta, baixa amb la pàgina fins que se'n veu el final (botó de descàrrega) i s'enganxa per baix. */
function ajustarFitxa() {
  const f = document.querySelector(".fitxa");
  if (!f) return;
  f.style.top = `${Math.min(16, window.innerHeight - f.offsetHeight - 16)}px`;
}

/* Els tooltips no poden sortir de la pantalla (sobretot al mòbil): si cal, es desplacen */
function encabirTooltip(cont) {
  const box = cont.querySelector(".tooltip-box");
  if (!box) return;
  box.style.transform = "";
  const r = box.getBoundingClientRect();
  const marge = 12;
  let dx = 0;
  if (r.right > window.innerWidth - marge) dx = window.innerWidth - marge - r.right;
  if (r.left + dx < marge) dx = marge - r.left;
  if (dx) box.style.transform = `translateX(${Math.round(dx)}px)`;
}

/* ===== Inici ===== */
function inicialitzarUI() {
  estat.rubrica = rubricaOriginal();
  estat.fases = { ...FASES_DEFECTE };
  estat.ordreFases = [...ORDRE_FASES_DEFECTE];
  estat.sel = selPerDefecte();
  estat.dinSel = dinPerDefecte();
  estat.arees = totesLesArees();
  carregarTemaPreferit();
  // v0.6.1: el cas comença en blanc; «Cas aleatori» n'omple un d'exemple
  $("infoOberta").value = "";
  $("infoOculta").value = "";
  $("freeTrait").maxLength = TRET_LLIURE.maxCaracters;

  ["assistantName", "companyName", "charName", "charRole", "infoOberta", "infoOculta"].forEach(id => $(id).addEventListener("input", refrescarVistes));
  $("freeTrait").addEventListener("input", () => { actualitzarComptador(); refrescarVistes(); });
  ["lang_cat", "lang_es", "lang_en", "forceLanguages"].forEach(id => $(id).addEventListener("change", () => { actualitzarNotaLlengua(); refrescarVistes(); }));
  ["advancedMode", "dynamicProfile"].forEach(id => $(id).addEventListener("change", canviMode));
  $("meetingClose").addEventListener("change", canviTancament);
  $("evalCode").addEventListener("input", canviCodi);
  $("evalCodeSwitch").addEventListener("change", canviCodiPropi);
  $("evalCode").addEventListener("blur", renderCodi);
  ["meetingWarn", "meetingExtra"].forEach(id => $(id).addEventListener("change", canviTancament));
  $("randomIdentity").addEventListener("change", renderitzar);
  document.querySelectorAll(".tooltip-container").forEach(c => {
    c.addEventListener("mouseenter", () => encabirTooltip(c));
    c.addEventListener("focusin", () => encabirTooltip(c));
  });
  document.addEventListener("keydown", e => {
    if (!$("visorOverlay").classList.contains("open") || modeVisor !== "lectura" || $("promptLectura").hidden) return;
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); anarPaginaVisor(paginaVisor + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); anarPaginaVisor(paginaVisor - 1); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { tancarGuiaCas(); tancarEditor(); tancarVisor(); tancarRubrica(); } });

  activarArrossegament($("traitsContainer"), {
    selector: ".trait-row", id: el => el.dataset.attr,
    actiu: () => esAvancat(), seleccionats: () => selTrets.actiu ? selTrets.ids : new Set(), enOrdre: nouOrdreTrets
  });
  activarArrossegament($("rbItems"), {
    selector: ".rb-item", id: el => el.dataset.id,
    actiu: () => true, seleccionats: () => selCrit.actiu ? selCrit.ids : new Set(), enOrdre: nouOrdreCriteris
  });
  activarArrossegament($("fasesContainer"), {
    selector: ".fase-mobil", id: el => el.dataset.fase, horitzontal: true,
    actiu: () => true, seleccionats: () => new Set(), enOrdre: nouOrdreFases
  });
  activarPestanya("projecte");
  aplicarTextosUI();
  window.addEventListener("resize", ajustarFitxa);
  if (window.ResizeObserver) new ResizeObserver(ajustarFitxa).observe(document.querySelector(".fitxa"));
  ajustarFitxa();
  actualitzarNotaLlengua();
  textInicial = instantaniaText();
  esborranyPendent = llegirEsborrany();
  renderAvisEsborrany();
}

window.addEventListener("DOMContentLoaded", inicialitzarUI);
</script>
</body>
</html>
